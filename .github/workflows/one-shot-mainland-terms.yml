name: One-shot mainland terminology correction

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/one-shot-mainland-terms.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/mnt-20260829-01-time-boundary-pr
          fetch-depth: 0

      - name: Apply targeted correction and policy guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          data_paths = [
              Path("public/data/latest.json"),
              Path("public/data/archive/2026/08/2026-08-29-am.json"),
          ]
          for path in data_paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              assert data["id"] == "2026-08-29-am"
              entry = next(item for item in data["entries"] if item["id"] == "2026-08-29-am-news-0")
              assert entry["headline"] == "《绝区零》3.2版本定于9月9日上线，新增“装甲师”定位"
              assert "Their Secret Histories" in entry["summary"]
              assert "Armorer" in entry["summary"]
              entry["headline"] = "《绝区零》3.2版本“她与她的隐秘往事”9月9日上线，新增“锋御”职业"
              entry["summary"] = "米哈游公布《绝区零》3.2版本“她与她的隐秘往事”将于9月9日上线。版本将加入全新代理人职业“锋御”，S级电属性锋御代理人克拉蕾在上半登场，S级风属性击破代理人洛克茜在下半登场，并带来剧情与登录奖励等内容。"
              entry["verification"] = "已打开Gematsu报道；日期与版本内容来自正文。可见中文术语按中国大陆官方简中命名修正：版本名“她与她的隐秘往事”及角色名“克拉蕾”“洛克茜”由《绝区零》官方简中前瞻核验，“锋御”按官方简中职业名采用；术语核验未用于新增事件事实。"
              assert len(entry.get("images", [])) == 1
              entry["images"][0]["alt"] = "绝区零：《绝区零》3.2版本“她与她的隐秘往事”9月9日上线，新增“锋御”职业相关配图"

              upcoming = next(item for item in data["upcoming"] if item["id"] == "upcoming-zenless-zone-zero-3-2")
              upcoming["note"] = "本期证据确认3.2版本“她与她的隐秘往事”于9月9日上线；版本名采用中国大陆官方简中命名。"

              old_checked = "《漫威金刚狼》与《绝区零》的简体中文名仅通过各自官方简中页面作title-only核验"
              new_checked = "《漫威金刚狼》简体中文名仅作title-only核验；《绝区零》游戏名、3.2版本名“她与她的隐秘往事”、职业名“锋御”及角色名通过中国大陆官方简中命名作terminology-only核验"
              checked = data["sourceReport"]["checked"]
              assert old_checked in checked
              checked[checked.index(old_checked)] = new_checked
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          assert data_paths[0].read_bytes() == data_paths[1].read_bytes()

          agents = Path("AGENTS.md")
          text = agents.read_text(encoding="utf-8")
          anchor = "A broadly used community or playful Chinese name may be selected when found on the open web; mark it `common_translation`, never official.\n"
          addition = "\nFor games with an official mainland-China Simplified Chinese channel or site, visible Chinese copy must use the official mainland Simplified Chinese terminology when available, not an overseas-source translation. This applies beyond the game title to named version subtitles, characters/agents, classes/professions, modes, mechanics, and other proper in-game terms. When the event packet is based on a foreign-language or overseas source, a narrow terminology-only lookup against an official mainland Simplified Chinese source is allowed to normalize wording; it must not add event facts, times, platforms, release claims, source classification, tracking decisions, or candidates.\n"
          assert text.count(anchor) == 1
          agents.write_text(text.replace(anchor, anchor + addition), encoding="utf-8")

          pipeline = Path("docs/DATA_PIPELINE.md")
          text = pipeline.read_text(encoding="utf-8")
          anchor = "Never machine-translate, literally translate, or invent a Chinese title merely to fill the field. A narrow open-web lookup is allowed solely to determine the game name and its status; it must not introduce new event facts, times, platforms, release claims, or candidates outside the finalized editorial packet. The publisher applies the registry again before serialization so a known translation is not lost when an editorial decision mistakenly leaves the title unavailable. Historical title-field corrections use `npm run titles:backfill`; the command fills currently unavailable title fields without overwriting an existing official/common translation, then normalizes visible story headlines and lead archive titles so a resolved Chinese game name does not remain English in display copy. The original English name stays in `title_en` metadata.\n"
          addition = "\n### Mainland Simplified Chinese terminology\n\nFor a game with an official mainland-China Simplified Chinese channel or site, visible Chinese copy must prefer that official mainland terminology for named version subtitles, characters/agents, classes/professions, modes, mechanics, and other proper in-game terms. Overseas media translations or literal English-to-Chinese renderings must not override an available mainland official term. This rule is separate from the cumulative game-title registry because version and system terminology can be release-specific.\n\nIf the finalized event evidence is foreign-language or overseas media, the editor may perform a narrow terminology-only lookup against an official mainland Simplified Chinese source. That lookup may normalize wording only: it must not add or change event facts, times, platforms, release claims, source classification, tracking decisions, or candidate events. A terminology source does not upgrade `fact_status` or become event evidence unless it independently supports the event claim under the normal source rules.\n"
          assert text.count(anchor) == 1
          pipeline.write_text(text.replace(anchor, anchor + addition), encoding="utf-8")

          contract = Path("docs/SCHEDULED_TASK_PROMPT.md")
          text = contract.read_text(encoding="utf-8")
          title_rule = "   - Never machine-translate, literally translate, or invent a Chinese game name merely to fill the field.\n"
          term_rule = "   - For games with an official mainland-China Simplified Chinese channel or site, visible version subtitles, characters/agents, classes/professions, named modes/mechanics, and other proper in-game terms must use the official mainland Simplified Chinese wording when available. If packet wording comes from a foreign-language or overseas source, perform only a narrow terminology-only lookup against an official mainland Simplified Chinese source.\n"
          assert text.count(title_rule) == 1
          text = text.replace(title_rule, title_rule + term_rule)
          old = "5. Title-name lookup is the only exception to the finalized packet's complete-evidence rule. It may be used solely to determine `titleZhCn` / `titleZhStatus`; it must not introduce a new event, fact, time, platform, release claim, source classification, or tracking decision.\n"
          new = "5. Title-name lookup and mainland-Chinese terminology lookup are the only exceptions to the finalized packet's complete-evidence rule. Title lookup may determine only `titleZhCn` / `titleZhStatus`; terminology-only lookup may normalize only official mainland Simplified Chinese wording for an already-present event. Neither lookup may introduce a new event, fact, time, platform, release claim, source classification, tracking decision, or candidate.\n"
          assert text.count(old) == 1
          contract.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("scripts/scheduled-task-contract.test.mjs")
          text = test.read_text(encoding="utf-8")
          marker = "});\n"
          test_case = '''\n  it("prefers official mainland terminology for Chinese games without expanding event evidence", () => {\n    expect(contract).toContain("official mainland-China Simplified Chinese channel or site");\n    expect(contract).toContain("visible version subtitles, characters/agents, classes/professions, named modes/mechanics");\n    expect(contract).toContain("terminology-only lookup");\n    expect(contract).toContain("Neither lookup may introduce a new event, fact, time, platform, release claim, source classification, tracking decision, or candidate.");\n  });\n'''
          assert text.endswith(marker)
          test.write_text(text[:-len(marker)] + test_case + marker, encoding="utf-8")

          ledger = Path("docs/MAINTENANCE_LOG.md")
          text = ledger.read_text(encoding="utf-8")
          assert "MNT-20260829-02" not in text
          insertion_point = "\n---\n\n## Resolved baseline from recent changes"
          entry = '''\n### MNT-20260829-02 — 海外事件源未回查中国游戏官方简中术语\n\n- **Discovered:** 2026-08-29\n- **Priority:** P1\n- **Area:** editorial localization / mainland Chinese terminology\n- **Status:** in_progress\n- **Evidence:** 当前 `2026-08-29-am` 的《绝区零》3.2 条目虽然游戏名已是 `official_simplified`，正文却沿用海外二手来源写成版本名 `Their Secret Histories`、职业 `Armorer/装甲师`、角色 `Claret/Roxy`；中国大陆官方简中命名应为版本“她与她的隐秘往事”、职业“锋御”、角色“克拉蕾/洛克茜”。说明现有规则只约束游戏标题，没有约束中国游戏的版本名、职业/角色等可见术语。\n- **Risk:** 面向中国大陆读者的简报会出现官方已有中文名却仍使用英文或海外直译的情况，造成事实表达不专业、搜索与读者认知不一致，并持续产生人工纠错。\n- **Proposed resolution:** 对拥有中国大陆官方简中渠道的游戏，正文可见专名优先采用大陆官方简中命名；当 finalized packet 来自海外/外语来源时，仅允许增加受限 terminology-only 核验来统一版本副标题、角色/代理人、职业、模式与机制名，不得借此新增或改变事件事实、时间、平台、发行主张、来源分类、tracking 或候选。当前《绝区零》条目以 revision 方式只修正文案、alt 与相关说明，不改期号、窗口、fact/time status 或事件来源。\n- **Close when:** `2026-08-29-am` archive 与 latest 同步使用“她与她的隐秘往事”“锋御”“克拉蕾”“洛克茜”；Scheduled/editorial contract 与数据规范明确 mainland terminology-only 边界并有回归测试；完整 Verify 与合并后 Pages 成功，且无无关生产数据变化。\n- **Resolution:** pending.\n- **Verification:** pending.\n'''
          assert text.count(insertion_point) == 1
          ledger.write_text(text.replace(insertion_point, entry + insertion_point), encoding="utf-8")
          PY

          git diff --check
          git status --short

      - name: Commit correction branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md docs/DATA_PIPELINE.md docs/SCHEDULED_TASK_PROMPT.md docs/MAINTENANCE_LOG.md scripts/scheduled-task-contract.test.mjs public/data/latest.json public/data/archive/2026/08/2026-08-29-am.json
          git commit -m "fix(editorial): use mainland official game terminology"
          git push origin HEAD:fix/mnt-20260829-01-time-boundary-pr
