name: Publish verified media

on:
  schedule:
    # 11:10 and 18:00 Asia/Shanghai (UTC+8); scheduled recovery only.
    # Precutover: both legacy recovery slots remain enabled.
    - cron: "10 3 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      edition_id:
        description: Optional exact edition ID to enrich
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: media-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover and normalize verified media
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          edition="${{ inputs.edition_id }}"
          if [ -n "$edition" ]; then
            if [[ ! "$edition" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm|daily)$ ]]; then
              echo "Invalid edition_id: $edition"
              exit 1
            fi
            node scripts/enrich-media.mjs --apply --edition="$edition"
          else
            npm run media:enrich
          fi

      - name: Validate media update
        run: npm run check

      - name: Upload media audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: media-audit-${{ github.run_id }}
          path: artifacts/media-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified media
        id: publication
        shell: bash
        run: |
          edition="${{ inputs.edition_id }}"
          if [ -z "$edition" ]; then
            edition="$(node -p "JSON.parse(require('fs').readFileSync('public/data/latest.json','utf8')).id")"
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- public/data public/media; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add public/data/latest.json public/data/archive public/media
          git commit -m "chore(media): enrich $edition"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to publish media after three attempts"
          exit 1

      - name: Deploy media update
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Acknowledge nonblocking media lane
        if: always()
        shell: bash
        run: |
          edition="${{ steps.publication.outputs.edition || inputs.edition_id }}"
          if [ -z "$edition" ]; then
            edition="$(node -p "JSON.parse(require('fs').readFileSync('public/data/latest.json','utf8')).id")"
          fi
          if [ "${{ steps.publication.outcome }}" = "success" ] && [ -f artifacts/media-audit.json ]; then
            IFS='|' read -r status reason < <(EDITION_ID="$edition" node -e '
              const fs = require("fs");
              const audit = JSON.parse(fs.readFileSync("artifacts/media-audit.json", "utf8"));
              const results = (audit.editions.find((item) => item.id === process.env.EDITION_ID)?.results || []);
              const unresolved = results.filter((item) => item.status !== "applied").length;
              const applied = results.filter((item) => item.status === "applied").length;
              const status = unresolved === 0 ? "available" : applied > 0 ? "partial" : "unavailable";
              process.stdout.write(`${status}|applied-${applied}-unresolved-${unresolved}`);
            ')
          else
            status="unavailable"
            reason="media-workflow-failed"
          fi
          bash scripts/update-edition-state-branch.sh \
            "$edition" media-status \
            --status="$status" \
            --reason="$reason"

      - name: Summarize media publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Media publication"
            echo "- Edition: ${{ steps.publication.outputs.edition || 'unresolved' }}"
            echo "- Data changed: ${{ steps.publication.outputs.changed || 'false' }}"
            echo "- Main commit: ${{ steps.publication.outputs.commit || 'unchanged' }}"
          } >> "$GITHUB_STEP_SUMMARY"
