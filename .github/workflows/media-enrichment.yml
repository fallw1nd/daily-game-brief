name: Propose verified media

on:
  schedule:
    # 10:35 and 17:25 Asia/Shanghai (UTC+8)
    - cron: "35 2 * * *"
    - cron: "25 9 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: media-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover and normalize verified media
        run: npm run media:enrich

      - name: Validate proposal
        run: npm run check

      - name: Prepare proposal metadata
        id: proposal
        shell: bash
        run: |
          edition="$(node -p "JSON.parse(require('fs').readFileSync('public/data/latest.json','utf8')).id")"
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "branch=automation/media-$edition" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- public/data public/media; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push proposal branch
        if: steps.proposal.outputs.changed == 'true'
        shell: bash
        run: |
          branch="${{ steps.proposal.outputs.branch }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch:refs/remotes/origin/$branch" || true
          git switch -C "$branch"
          git add public/data/latest.json public/data/archive public/media
          git commit -m "chore(media): enrich ${{ steps.proposal.outputs.edition }}"
          git push --force-with-lease origin "HEAD:$branch"

      - name: Open or update review PR
        if: steps.proposal.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="${{ steps.proposal.outputs.branch }}"
          existing="$(gh pr list --head "$branch" --base main --state open --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            echo "Updated $existing"
          else
            gh pr create --base main --head "$branch" --title "chore(media): enrich ${{ steps.proposal.outputs.edition }}" --body "Automated media proposal for **${{ steps.proposal.outputs.edition }}**. Review every crop, Chinese alt, credit, source page, platform priority, and unavailable reason before merging. This workflow never merges directly."
          fi
