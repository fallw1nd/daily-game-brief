name: Publish verified media

on:
  schedule:
    # Daily scheduled media recovery at 11:10 Asia/Shanghai (UTC+8).
    - cron: "10 3 * * *"
  workflow_dispatch:
    inputs:
      edition_id:
        description: Optional exact edition ID to enrich (am, pm, or daily)
        required: false
        type: string
      record_id:
        description: Optional single upcoming record ID whose existing cover identity should be revalidated
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: media-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover and normalize verified media
        id: discovery
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EDITION_ID: ${{ inputs.edition_id }}
          RECORD_ID: ${{ inputs.record_id }}
        shell: bash
        run: |
          edition="$EDITION_ID"
          record="$RECORD_ID"
          if [ -n "$record" ] && [ -z "$edition" ]; then
            echo "record_id requires an exact edition_id"
            exit 1
          fi
          if [ -z "$edition" ]; then
            edition="$(node -p "JSON.parse(require('fs').readFileSync('public/data/latest.json','utf8')).id")"
          fi
          if [[ ! "$edition" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm|daily)$ ]]; then
            echo "Invalid edition_id: $edition"
            exit 1
          fi
          if [[ -n "$record" && ! "$record" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid record_id: $record"
            exit 1
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          if [ -n "$record" ]; then
            node scripts/enrich-media.mjs --apply --edition="$edition" --revalidate-cover-id="$record"
          else
            node scripts/enrich-media.mjs --apply --edition="$edition"
          fi

      - name: Validate media update
        run: npm run check

      - name: Publish verified media
        id: publication
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EDITION_ID: ${{ steps.discovery.outputs.edition }}
          RECORD_ID: ${{ inputs.record_id }}
        shell: bash
        run: bash scripts/publish-verified-media.sh "$EDITION_ID" "$RECORD_ID"

      - name: Upload media audit
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: media-audit-${{ github.run_id }}
          path: artifacts/media-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy media update
        if: steps.publication.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EDITION_ID: ${{ steps.discovery.outputs.edition || inputs.edition_id }}
        shell: bash
        run: |
          if [ -z "$EDITION_ID" ]; then
            echo "Media deployment requires an exact edition ID"
            exit 1
          fi
          gh workflow run deploy.yml --ref main -f edition_id="$EDITION_ID"

      - name: Acknowledge nonblocking media lane
        if: always()
        env:
          EDITION_ID: ${{ steps.discovery.outputs.edition || inputs.edition_id }}
        shell: bash
        run: |
          edition="$EDITION_ID"
          if [ -z "$edition" ]; then
            edition="$(node -p "JSON.parse(require('fs').readFileSync('public/data/latest.json','utf8')).id")"
          fi
          edition_path="public/data/archive/${edition:0:4}/${edition:5:2}/$edition.json"
          if [ "${{ steps.publication.outcome }}" = "success" ] && [ -f "$edition_path" ]; then
            IFS='|' read -r status reason < <(node scripts/media-status.mjs "$edition_path")
          else
            status="unavailable"
            reason="media-workflow-failed"
          fi
          bash scripts/update-edition-state-branch.sh \
            "$edition" media-status \
            --status="$status" \
            --reason="$reason"

      - name: Summarize media publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Media publication"
            echo "- Edition: ${{ steps.publication.outputs.edition || 'unresolved' }}"
            echo "- Data changed: ${{ steps.publication.outputs.changed || 'false' }}"
            echo "- Main commit: ${{ steps.publication.outputs.commit || 'unchanged' }}"
          } >> "$GITHUB_STEP_SUMMARY"
