name: Close MNT-20260901-04 ledger

on:
  push:
    branches:
      - automation/maintenance-ledger-mnt-20260901-04
    paths:
      - .github/workflows/maintenance-ledger-mnt-20260901-04.yml

permissions:
  contents: write

jobs:
  update-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Update maintenance entry exactly
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/MAINTENANCE_LOG.md')
          text = path.read_text(encoding='utf-8')
          marker = '## MNT-20260901-04 — 知名评分事件缺少原媒体直采，导致依赖二手转述'
          if text.count(marker) != 1:
              raise SystemExit(f'expected exactly one target marker, got {text.count(marker)}')
          prefix, section = text.split(marker, 1)

          old_status = '- **Status:** in_progress'
          old_resolution = '- **Resolution:** `fix/ign-direct-review-source` 已注册并经两次 runner observation 后将 `ign-games` 从 shadow 提升为 active，增加 bounded commerce filter 与 registry/filter 回归测试；PR / merge pending。'
          old_verification = '- **Verification:** shadow observation runs [33488938868](https://github.com/fallw1nd/daily-game-brief/actions/runs/33488938868) 与 [33489262329](https://github.com/fallw1nd/daily-game-brief/actions/runs/33489262329) 均成功；完整 Verify、merge 与 post-merge active observation pending，因此本条暂不标记 resolved。'

          for needle in (old_status, old_resolution, old_verification):
              if section.count(needle) != 1:
                  raise SystemExit(f'expected exactly one target line: {needle}')

          section = section.replace(old_status, '- **Status:** resolved', 1)
          section = section.replace(
              old_resolution,
              '- **Resolution:** [PR #98](https://github.com/fallw1nd/daily-game-brief/pull/98) / merge commit `485fc3ba0474a8a2ae98ad72879c354e484184b3` 将 `ign-games` 以 `media + high`、`news/reviews/features/interviews` capabilities 正式升为 active，保留 GameSpot 现有 active 直采，并加入 bounded commerce filter、source registry / filter 回归测试与来源策略文档；普通单篇 Review 仍按 `reviews` lane 处理，不因来源品牌自动升级为 `review-score`。Metacritic/OpenCritic 的聚合分继续明确留给后续 durable snapshot/change-detection score-surface 机制，避免用当前页面状态伪造固定窗口内的“开分时间”。',
              1,
          )
          section = section.replace(
              old_verification,
              '- **Verification:** shadow observation runs [33488938868](https://github.com/fallw1nd/daily-game-brief/actions/runs/33488938868) 与 [33489262329](https://github.com/fallw1nd/daily-game-brief/actions/runs/33489262329) 均成功；PR #98 最终 Verify run [33490339002](https://github.com/fallw1nd/daily-game-brief/actions/runs/33490339002) 通过完整 `npm run check` 并合并到 `main`。合并后 read-only acceptance run [33494171240](https://github.com/fallw1nd/daily-game-brief/actions/runs/33494171240) 成功：19/19 active sources healthy，`ign-games` 为 `mode:"active"` / `status:"ok"`，直接形成 `Onimusha: Way of the Sword Review` 与 `The Blood of Dawnwalker Review` 两条 `reviews` lane 候选，两者均保留 `2026-08-31T15:00:00Z` 精确发布时间并位于目标 Daily window。此次验收没有写入 automation state、packet、Canonical、public data、固定窗口、schema 或 Scheduled Task，关闭条件全部满足。',
              1,
          )

          path.write_text(prefix + marker + section, encoding='utf-8')
          PY

      - name: Remove one-shot workflow and commit ledger only
        run: |
          git rm .github/workflows/maintenance-ledger-mnt-20260901-04.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/MAINTENANCE_LOG.md
          git diff --cached --check
          git diff --cached --name-only
          expected=$'.github/workflows/maintenance-ledger-mnt-20260901-04.yml\ndocs/MAINTENANCE_LOG.md'
          test "$(git diff --cached --name-only | sort)" = "$expected"
          git commit -m "docs(maintenance): resolve direct review source gap"
          git push origin HEAD:automation/maintenance-ledger-mnt-20260901-04
