name: Apply title translation backfill round 2 once

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/apply-title-backfill-round2-2026-08-27.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/title-translation-fallback
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add second-round confirmed translations
        shell: node {0}
        run: |
          const fs = require('fs');
          const p = 'config/title-translations.json';
          const data = JSON.parse(fs.readFileSync(p, 'utf8'));
          const additions = {
            'brigandine-abyss': {titleZhCn:'幻想大陆战记 深渊',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://brigandine-abyss.happinet-games.com/products/?lang=sc',note:'官方简体中文站与 Steam 简中商店名'}},
            'bioeden': {titleZhCn:'创生伊甸',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/3265840/BioEden/?l=schinese',note:'Steam 官方简中正文以《创生伊甸》称呼本作'}},
            'demons-night-fever': {titleZhCn:'恶魔夜疯狂',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/3502620/DEMONS_NIGHT_FEVER/?l=schinese',note:'Steam 简中本地化名称'}},
            'how-to-fish': {titleZhCn:'渔力全开',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/4001890/How_to_Fish/?l=schinese',note:'Steam 简体中文商店名'}},
            'order-automatica': {titleZhCn:'九格生死战',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/2105840/Order_Automatica/?l=schinese',note:'Steam 简体中文商店名'}},
            'screenbound': {titleZhCn:'屏行世界',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/2805070/Screenbound/?l=schinese',note:'Steam 简中官方描述使用《屏行世界》'}},
            'shroom-and-gloom': {titleZhCn:'菇域幽城',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/3271280/?l=schinese',note:'Steam 简体中文本地化商店名'}},
            'police-simulator': {titleZhCn:'警察模拟器：巡警',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/997010/Police_Simulator_Patrol_Officers/?l=schinese',note:'Steam 简体中文商店名'}},
            'tails-of-iron-2': {titleZhCn:'铁尾传奇 2：凛冬之战',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.epicgames.com/zh-CN/p/tails-of-iron-ii-whiskers-of-winter-cf6611',note:'Epic 官方简中页面与 DLC 名称使用《铁尾传奇 2：凛冬之战》'}},
            'valheim': {titleZhCn:'Valheim: 英灵神殿',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/892970/Valheim/?l=schinese',note:'Steam 简体中文商店名'}},
            'wheelmates': {titleZhCn:'双轮成行',titleZhStatus:'official_simplified',evidence:{kind:'official_source',url:'https://store.steampowered.com/app/3905450/?l=schinese',note:'Steam 简中本地化名称为 WheelMates (双轮成行)'}},
            'rpg-maker-u2u': {titleZhCn:'RPG制作大师 U2U',titleZhStatus:'common_translation',evidence:{kind:'common_usage',url:'https://search.bilibili.com/all?keyword=RPG%E5%88%B6%E4%BD%9C%E5%A4%A7%E5%B8%88U2U',note:'大陆用户长期将 RPG Maker 系列称为“RPG制作大师”，新作已有稳定使用'}}
          };
          for (const [key, value] of Object.entries(additions)) {
            const existing = data.translations[key];
            if (existing) {
              console.log(`Keeping existing registered translation for ${key}: ${existing.titleZhCn}`);
              continue;
            }
            data.translations[key] = value;
          }
          data.updatedAt = '2026-08-27';
          data.translations = Object.fromEntries(Object.entries(data.translations).sort(([a],[b]) => a.localeCompare(b)));
          fs.writeFileSync(p, JSON.stringify(data, null, 2) + '\n');

      - name: Backfill registered translations
        run: npm run titles:backfill

      - name: Validate repository
        run: npm run check

      - name: Guard changed paths
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(config/title-translations\.json|public/data/latest\.json|public/data/archive/.+\.json)$' | grep -q .; then
            echo 'Unexpected changed path:'
            echo "$changed"
            exit 1
          fi
          test -n "$changed"

      - name: Commit second round
        shell: bash
        run: |
          git config user.name 'daily-game-brief[bot]'
          git config user.email 'daily-game-brief[bot]@users.noreply.github.com'
          git add config/title-translations.json public/data/latest.json public/data/archive
          git commit -m 'chore(titles): backfill second-round Chinese names'
          git push origin HEAD:codex/title-translation-fallback
