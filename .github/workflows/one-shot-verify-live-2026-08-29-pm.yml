name: Verify live 2026-08-29-pm

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/one-shot-verify-live-2026-08-29-pm.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify live data and media
        shell: bash
        run: |
          set -euo pipefail
          base="https://fallw1nd.github.io/daily-game-brief"
          tmp="$(mktemp -d)"
          curl --fail --location --retry 5 --retry-delay 2 "$base/data/latest.json" -o "$tmp/latest.json"
          curl --fail --location --retry 5 --retry-delay 2 "$base/data/manifest.json" -o "$tmp/manifest.json"
          curl --fail --location --retry 5 --retry-delay 2 "$base/data/archive/2026/08/2026-08-29-pm.json" -o "$tmp/archive.json"
          curl --fail --location --retry 5 --retry-delay 2 "$base/data/search-index.json" -o "$tmp/search.json"

          test "$(jq -r .id "$tmp/latest.json")" = "2026-08-29-pm"
          test "$(jq -r .issueNumber "$tmp/latest.json")" = "18"
          test "$(jq -r .latest "$tmp/manifest.json")" = "2026-08-29-pm"
          test "$(jq -r '.editions[-1].issueNumber' "$tmp/manifest.json")" = "18"
          test "$(jq -r .id "$tmp/archive.json")" = "2026-08-29-pm"
          test "$(jq -r .issueNumber "$tmp/archive.json")" = "18"
          cmp -s "$tmp/latest.json" "$tmp/archive.json"
          hits="$(jq '[.entries[] | select(.editionId == "2026-08-29-pm")] | length' "$tmp/search.json")"
          test "$hits" -eq 3

          for path in \
            media/briefs/2026/08/2026-08-29-pm/2026-08-29-pm-features-0-editorial.jpg \
            media/briefs/2026/08/2026-08-29-pm/2026-08-29-pm-industry-0-editorial.jpg \
            media/briefs/2026/08/2026-08-29-pm/2026-08-29-pm-industry-1-editorial.jpg; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' --retry 5 --retry-delay 2 "$base/$path")"
            test "$code" = "200"
            echo "HTTP 200 $path"
          done

          {
            echo "## Live verification"
            echo "- latest: 2026-08-29-pm / issue 18"
            echo "- manifest latest: 2026-08-29-pm / issue 18"
            echo "- archive: 2026-08-29-pm / issue 18"
            echo "- latest/archive: byte-identical"
            echo "- search-index entries: $hits"
            echo "- media URLs: 3/3 HTTP 200"
          } >> "$GITHUB_STEP_SUMMARY"
