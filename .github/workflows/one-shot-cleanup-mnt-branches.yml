name: One-shot cleanup merged maintenance branches

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/one-shot-cleanup-mnt-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout state branch
        uses: actions/checkout@v4
        with:
          ref: automation/state
          fetch-depth: 0

      - name: Delete completed maintenance branches
        shell: bash
        run: |
          git push origin --delete \
            docs/mnt-20260829-01-resolution \
            fix/mnt-20260829-01-time-boundary \
            fix/mnt-20260829-01-time-boundary-pr
