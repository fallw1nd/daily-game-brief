name: Patch secondary cover once

on:
  push:
    branches:
      - codex/media-secondary-cover-auto-accept
    paths:
      - .github/workflows/patch-secondary-cover-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/media-secondary-cover-auto-accept

      - name: Patch cover source eligibility
        shell: python
        run: |
          from pathlib import Path
          path = Path("scripts/enrich-media.mjs")
          text = path.read_text()
          old = '  return source.kind === "primary" || source.webSearch === true;'
          new = '  return source.kind === "primary" || source.kind === "secondary" || source.webSearch === true;'
          if old not in text:
            raise SystemExit("eligibleCover block not found")
          path.write_text(text.replace(old, new, 1))

      - name: Check syntax
        run: node --check scripts/enrich-media.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add scripts/enrich-media.mjs
          git commit -m "fix(media): auto-accept same-title secondary cover art"
          git push origin HEAD:codex/media-secondary-cover-auto-accept
