name: Audit localized story headlines once

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/audit-localized-headlines-2026-08-27.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/localize-story-headlines
      - name: Audit title/headline mismatches
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const targets = [
            'Minecraft Dungeons',
            'Orbitals',
            'Stranger Than Heaven',
            'Total War: Warhammer 40,000',
            'Sonic Pico Park',
            'Alien Isolation 2',
            'Nodusfall'
          ];
          const files = [];
          for (const year of fs.readdirSync('public/data/archive')) {
            const yd = path.join('public/data/archive', year);
            if (!fs.statSync(yd).isDirectory()) continue;
            for (const month of fs.readdirSync(yd)) {
              const md = path.join(yd, month);
              if (!fs.statSync(md).isDirectory()) continue;
              for (const file of fs.readdirSync(md)) if (file.endsWith('.json')) files.push(path.join(md, file));
            }
          }
          const docs = files.sort().map(file => [file, JSON.parse(fs.readFileSync(file, 'utf8'))]);
          const mismatches = [];
          const targetHits = [];
          for (const [file, doc] of docs) {
            for (const entry of doc.entries || []) {
              const t = entry.title || {};
              if (t.title_zh_cn && t.title_en && entry.headline && entry.headline.includes(t.title_en)) {
                mismatches.push({file,id:entry.id,key:t.title_key,en:t.title_en,zh:t.title_zh_cn,headline:entry.headline});
              }
              for (const target of targets) {
                if ((t.title_en || '').toLowerCase().includes(target.toLowerCase()) || (entry.headline || '').toLowerCase().includes(target.toLowerCase())) {
                  targetHits.push({kind:'entry',target,file,id:entry.id,key:t.title_key,en:t.title_en,zh:t.title_zh_cn,status:t.title_zh_status,headline:entry.headline});
                }
              }
            }
            for (const item of doc.upcoming || []) {
              const t = item.title || {};
              for (const target of targets) {
                if ((t.title_en || '').toLowerCase().includes(target.toLowerCase())) {
                  targetHits.push({kind:'upcoming',target,file,id:item.id,key:t.title_key,en:t.title_en,zh:t.title_zh_cn,status:t.title_zh_status});
                }
              }
            }
          }
          console.log('=== HEADLINE_MISMATCH_COUNT ===');
          console.log(mismatches.length);
          console.log(JSON.stringify(mismatches, null, 2));
          console.log('=== PROVIDED_TITLE_HITS ===');
          console.log(JSON.stringify(targetHits, null, 2));
