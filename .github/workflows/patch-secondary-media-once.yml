name: Patch secondary media once

on:
  push:
    branches:
      - codex/media-secondary-auto-accept
    paths:
      - .github/workflows/patch-secondary-media-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/media-secondary-auto-accept

      - name: Patch editorial source eligibility
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("scripts/enrich-media.mjs")
          text = path.read_text()
          pattern = re.compile(
              r'      const eligible = \(source\.kind === "primary" \|\| source\.webSearch === true\) &&\n'
              r'        \(kind === "editorial" \|\| eligibleCover\(source\)\);'
          )
          replacement = '''      const eligible = kind === "editorial"
                ? source.kind === "primary" || source.kind === "secondary" || source.webSearch === true
                : eligibleCover(source);'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit("eligibility block not found")
          path.write_text(text)

      - name: Check syntax
        run: node --check scripts/enrich-media.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add scripts/enrich-media.mjs
          git commit -m "fix(media): auto-accept exact secondary story images"
          git push origin HEAD:codex/media-secondary-auto-accept
