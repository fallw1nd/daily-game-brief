name: Brief publication SLA watchdog

on:
  schedule:
    # 10:45 and 17:35 Asia/Shanghai; avoids relying on a single edition trigger.
    - cron: "45 2 * * *"
    - cron: "35 9 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Edition period to verify
        required: true
        type: choice
        options:
          - am
          - pm

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: brief-sla-watchdog-${{ github.event.schedule || inputs.period }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select fixed edition period
        id: edition
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
          elif [ "${{ github.event.schedule }}" = "45 2 * * *" ]; then
            period="am"
          else
            period="pm"
          fi
          echo "period=$period" >> "$GITHUB_OUTPUT"

      - name: Check repository and deployed manifest
        id: sla
        run: node scripts/check-brief-sla.mjs --period=${{ steps.edition.outputs.period }}

      - name: Restore matching editorial packet
        id: packet
        shell: bash
        run: |
          mkdir -p artifacts
          git fetch origin automation/state:refs/remotes/origin/automation/state || true
          git show "origin/automation/state:automation/ledger/events.json" > artifacts/event-ledger-previous.json 2>/dev/null || true
          if git show "origin/automation/state:automation/packets/latest-${{ steps.edition.outputs.period }}.json" > artifacts/editorial-packet.json 2>/dev/null; then
            packet_id="$(node -e 'const fs=require("fs"); const packet=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(packet.editorialInput.window.id)' artifacts/editorial-packet.json)"
            if [ "$packet_id" = "${{ steps.sla.outputs.expected }}" ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "Packet is stale: $packet_id" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild a missing or stale packet
        id: recovery
        if: steps.sla.outputs.status != 'healthy' && steps.packet.outputs.available != 'true'
        continue-on-error: true
        shell: bash
        run: |
          node scripts/collect-news.mjs --period=${{ steps.edition.outputs.period }}
          node scripts/update-event-ledger.mjs
          node scripts/build-evidence.mjs
          node scripts/editorialize.mjs
          packet_id="$(node -e 'const fs=require("fs"); const packet=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(packet.editorialInput.window.id)' artifacts/editorial-packet.json)"
          if [ "$packet_id" != "${{ steps.sla.outputs.expected }}" ]; then
            echo "Recovered packet is for $packet_id, expected ${{ steps.sla.outputs.expected }}"
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Preserve recovered packet and ledger
        if: steps.recovery.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          state_dir="$RUNNER_TEMP/automation-state-recovery"
          packet="$RUNNER_TEMP/editorial-packet.json"
          ledger="$RUNNER_TEMP/event-ledger.json"
          cp artifacts/editorial-packet.json "$packet"
          cp artifacts/event-ledger.json "$ledger"
          git fetch origin automation/state:refs/remotes/origin/automation/state || true
          if git show-ref --verify --quiet refs/remotes/origin/automation/state; then
            git worktree add --detach "$state_dir" origin/automation/state
          else
            git worktree add -b automation-state-recovery "$state_dir" origin/main
          fi
          edition_id="${{ steps.sla.outputs.expected }}"
          period="${{ steps.edition.outputs.period }}"
          mkdir -p "$state_dir/automation/packets" "$state_dir/automation/ledger"
          cp "$packet" "$state_dir/automation/packets/$edition_id.json"
          cp "$packet" "$state_dir/automation/packets/latest-$period.json"
          cp "$ledger" "$state_dir/automation/ledger/events.json"
          git -C "$state_dir" config user.name "daily-game-brief[bot]"
          git -C "$state_dir" config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git -C "$state_dir" add automation/packets automation/ledger/events.json
          if ! git -C "$state_dir" diff --cached --quiet; then
            git -C "$state_dir" commit -m "chore(automation): recover $edition_id packet"
            git -C "$state_dir" push origin HEAD:automation/state
          fi

      - name: Resolve usable packet
        id: packet_ready
        shell: bash
        run: |
          if [ "${{ steps.packet.outputs.available }}" = "true" ] || [ "${{ steps.recovery.outputs.available }}" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit published coverage
        id: coverage
        if: steps.packet_ready.outputs.available == 'true'
        env:
          NEWS_EVIDENCE_PATH: artifacts/editorial-packet.json
        run: node scripts/audit-news-coverage.mjs

      - name: Build and publish degraded fact list
        id: fallback
        if: steps.sla.outputs.status != 'healthy' && steps.packet_ready.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git pull --ff-only origin main
          node scripts/build-degraded-decision.mjs
          node scripts/publish-editorial-decision.mjs
          node scripts/validate-data.mjs
          if git diff --quiet -- public/data; then
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "content(brief): publish degraded ${{ steps.sla.outputs.expected }}"
          git push origin HEAD:main
          gh workflow run deploy.yml --ref main
          gh workflow run media-enrichment.yml --ref main -f edition_id=${{ steps.sla.outputs.expected }}
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Open or update SLA incident
        if: steps.sla.outputs.status != 'healthy' && steps.fallback.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Brief SLA incident: ${{ steps.sla.outputs.expected }}"
          existing="$(gh issue list --state open --search "$title in:title" --json url --jq '.[0].url // ""')"
          body="The scheduled edition did not reach a healthy deployed state by the SLA check.\n\n- Expected: **${{ steps.sla.outputs.expected }}**\n- Status: **${{ steps.sla.outputs.status }}**\n- Local latest: **${{ steps.sla.outputs.local_latest }}**\n- Online latest: **${{ steps.sla.outputs.online_latest || 'unavailable' }}**\n- High-confidence omissions: **${{ steps.coverage.outputs.high_omissions || 'not available' }}**\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nThe fixed editorial window must not move during recovery."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "automation" || gh issue create --title "$title" --body "$body"
          fi

      - name: Close resolved SLA incident
        if: steps.sla.outputs.status == 'healthy' || steps.fallback.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Brief SLA incident: ${{ steps.sla.outputs.expected }}"
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // ""')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The archive and deployed manifest now contain ${{ steps.sla.outputs.expected }}."
          fi

      - name: Write SLA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Brief SLA"
            echo "- Expected: ${{ steps.sla.outputs.expected }}"
            echo "- Status: ${{ steps.sla.outputs.status }}"
            echo "- Local latest: ${{ steps.sla.outputs.local_latest }}"
            echo "- Online latest: ${{ steps.sla.outputs.online_latest || 'unavailable' }}"
            echo "- Original packet: ${{ steps.packet.outputs.available || 'false' }}"
            echo "- Recovered packet: ${{ steps.recovery.outputs.available || 'false' }}"
            echo "- Usable packet: ${{ steps.packet_ready.outputs.available || 'false' }}"
            echo "- High-confidence omissions: ${{ steps.coverage.outputs.high_omissions || 'not available' }}"
            echo "- Review omissions: ${{ steps.coverage.outputs.review_omissions || 'not available' }}"
            echo "- Degraded fallback published: ${{ steps.fallback.outputs.published || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage audit
        if: always() && steps.packet_ready.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-audit-${{ steps.sla.outputs.expected }}-${{ github.run_id }}
          path: |
            artifacts/news-candidates.json
            artifacts/news-shadow-report.json
            artifacts/news-evidence.json
            artifacts/event-ledger.json
            artifacts/editorial-packet.json
            artifacts/news-coverage-audit.json
          if-no-files-found: warn
          retention-days: 14
