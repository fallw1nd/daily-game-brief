name: Brief publication SLA watchdog

on:
  schedule:
    # 11:00 preflight keeps packet recovery independent; 11:40 is the Daily degraded fallback deadline.
    - cron: "0 3 * * *"
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Edition period to verify
        required: true
        type: choice
        options:
          - am
          - pm
          - daily

      edition:
        description: Exact edition ID for manual verification
        required: true
        type: string
permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  # Exact-edition recovery must not cancel another recovery run.
  group: brief-sla-watchdog-${{ github.event_name == 'workflow_dispatch' && inputs.edition || 'scheduled-daily' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select immutable due edition
        id: edition
        shell: bash
        run: |
          git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
            node scripts/resolve-packet-dispatch.mjs \
              --period="$period" \
              --edition="${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
          else
            period="daily"
            state_dir="$RUNNER_TEMP/sla-state-selection"
            git worktree add --detach "$state_dir" origin/automation/state
            node scripts/resolve-due-edition.mjs \
              --period="$period" \
              --purpose=publication \
              --status-root="$state_dir/automation/status" >> "$GITHUB_OUTPUT"
            git worktree remove --force "$state_dir"
          fi
          echo "period=$period" >> "$GITHUB_OUTPUT"

      - name: Check repository and deployed manifest
        id: sla
        run: node scripts/check-brief-sla.mjs --period=${{ steps.edition.outputs.period }} --edition=${{ steps.edition.outputs.edition }}

      - name: Resolve degraded fallback deadline
        id: deadline
        shell: bash
        env:
          EDITION_ID: ${{ steps.edition.outputs.edition }}
          PERIOD: ${{ steps.edition.outputs.period }}
        run: |
          node - <<'NODE' >> "$GITHUB_OUTPUT"
          const edition = process.env.EDITION_ID || "";
          const period = process.env.PERIOD || "";
          if (period !== "daily") {
            console.log("degraded_due=true");
            process.exit(0);
          }
          const date = edition.slice(0, 10);
          const deadline = new Date(`${date}T03:40:00Z`);
          console.log(`degraded_due=${Date.now() >= deadline.getTime() ? "true" : "false"}`);
          NODE

      - name: Restore acknowledged immutable packet
        id: packet
        shell: bash
        run: |
          mkdir -p artifacts
          git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state || true
          git show "origin/automation/state:automation/ledger/events.json" > artifacts/event-ledger-previous.json 2>/dev/null || true
          edition="${{ steps.edition.outputs.edition }}"
          packet_sha="$(git show "origin/automation/state:automation/status/$edition.json" 2>/dev/null | node -e 'let text=""; process.stdin.on("data", value => text += value).on("end", () => { try { process.stdout.write(JSON.parse(text).packet.blobSha || ""); } catch {} });')"
          if [[ "$packet_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$packet_sha^{blob}"; then
            git cat-file blob "$packet_sha" > artifacts/editorial-packet.json
          elif git show "origin/automation/state:automation/packets/$edition.json" > artifacts/editorial-packet.json 2>/dev/null; then
            packet_sha="$(git hash-object artifacts/editorial-packet.json)"
          else
            packet_sha=""
          fi
          if [ -n "$packet_sha" ] && node scripts/validate-editorial-packet.mjs \
            --edition="$edition" \
            --period=${{ steps.edition.outputs.period }}; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "packet_blob_sha=$packet_sha" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Exact packet is missing, stale, or invalid; GitHub recovery owns the rebuild." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Rebuild a missing, stale, or invalid packet
        id: recovery
        if: steps.sla.outputs.status != 'healthy' && steps.packet.outputs.available != 'true'
        continue-on-error: true
        shell: bash
        run: |
          BRIEF_NOW="${{ steps.edition.outputs.reference_now }}" node scripts/collect-news.mjs --period=${{ steps.edition.outputs.period }}
          node scripts/update-event-ledger.mjs
          node scripts/build-evidence.mjs
          node scripts/editorialize.mjs
          node scripts/validate-editorial-packet.mjs \
            --edition=${{ steps.sla.outputs.expected }} \
            --period=${{ steps.edition.outputs.period }}
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Preserve recovered packet and acknowledgement
        if: steps.recovery.outputs.available == 'true'
        shell: bash
        run: |
          packet="$RUNNER_TEMP/editorial-packet.json"
          ledger="$RUNNER_TEMP/event-ledger.json"
          cp artifacts/editorial-packet.json "$packet"
          cp artifacts/event-ledger.json "$ledger"
          edition_id="${{ steps.edition.outputs.edition }}"
          period="${{ steps.edition.outputs.period }}"
          success=false
          for attempt in 1 2 3; do
            state_dir="$RUNNER_TEMP/sla-packet-state-$attempt"
            git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
            git worktree add --detach "$state_dir" origin/automation/state
            mkdir -p "$state_dir/automation/packets" "$state_dir/automation/ledger"
            cp "$packet" "$state_dir/automation/packets/$edition_id.json"
            cp "$packet" "$state_dir/automation/packets/latest-$period.json"
            cp "$ledger" "$state_dir/automation/ledger/events.json"
            node scripts/record-edition-state.mjs \
              --state-root="$state_dir" \
              --edition="$edition_id" \
              --event=packet-ready \
              --packet="$packet" \
              --run-id="${{ github.run_id }}"
            git -C "$state_dir" config user.name "daily-game-brief[bot]"
            git -C "$state_dir" config user.email "daily-game-brief[bot]@users.noreply.github.com"
            git -C "$state_dir" add automation/packets automation/ledger/events.json "automation/status/$edition_id.json"
            if git -C "$state_dir" diff --cached --quiet; then
              success=true
            else
              git -C "$state_dir" commit -m "chore(automation): recover $edition_id packet acknowledgement"
              if git -C "$state_dir" push origin HEAD:automation/state; then success=true; fi
            fi
            git worktree remove --force "$state_dir"
            if [ "$success" = "true" ]; then break; fi
          done
          if [ "$success" != "true" ]; then exit 1; fi

      - name: Resolve usable packet
        id: packet_ready
        shell: bash
        run: |
          if [ "${{ steps.packet.outputs.available }}" = "true" ] || [ "${{ steps.recovery.outputs.available }}" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit published coverage
        id: coverage
        if: steps.packet_ready.outputs.available == 'true'
        env:
          NEWS_EVIDENCE_PATH: artifacts/editorial-packet.json
        run: node scripts/audit-news-coverage.mjs

      - name: Build and publish degraded fact list
        id: fallback
        if: steps.deadline.outputs.degraded_due == 'true' && steps.sla.outputs.status != 'healthy' && steps.packet_ready.outputs.available == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          edition="${{ steps.sla.outputs.expected }}"
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-degraded-decision.mjs
            node scripts/publish-editorial-decision.mjs
            node scripts/validate-data.mjs

            if git diff --quiet -- public/data; then
              echo "Repository already contains $edition; re-dispatching Pages for deployment recovery."
              gh workflow run deploy.yml --ref main
              echo "published=false" >> "$GITHUB_OUTPUT"
              echo "deploy_retriggered=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add public/data
            git commit -m "content(brief): publish degraded $edition"
            if git push origin HEAD:main; then
              gh workflow run deploy.yml --ref main
              gh workflow run media-enrichment.yml --ref main -f edition_id=$edition
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "main advanced during degraded publication; rebuilding $edition (attempt $((attempt + 1))/3)"
            fi
          done

          echo "Failed to publish degraded $edition after three rebuild attempts"
          exit 1

      - name: Acknowledge degraded publication
        if: steps.fallback.outputs.published == 'true'
        shell: bash
        run: |
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.edition.outputs.edition }}" editorial-timeout
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.edition.outputs.edition }}" publication-committed \
            --main-sha="${{ steps.fallback.outputs.commit }}" \
            --source=degraded
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.edition.outputs.edition }}" locale-status \
            --status=unavailable \
            --reason=editorial-overlay-missing

      - name: Record degraded publication failure state
        if: steps.fallback.outcome == 'failure'
        shell: bash
        run: |
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.edition.outputs.edition }}" editorial-timeout
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.edition.outputs.edition }}" publication-failed \
            --error="SLA degraded publisher failed"
      - name: Write degraded outcomes to persistent ledger
        id: ledger_feedback
        if: steps.fallback.outputs.published == 'true'
        continue-on-error: true
        shell: bash
        run: |
          edition="${{ steps.sla.outputs.expected }}"
          decided_at="$(git show -s --format=%cI HEAD)"
          success=false
          for attempt in 1 2 3; do
            state_dir="$RUNNER_TEMP/degraded-ledger-$attempt"
            git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
            git worktree add --detach "$state_dir" origin/automation/state
            EDITORIAL_DECIDED_AT="$decided_at" EVENT_LEDGER_PATH="$state_dir/automation/ledger/events.json" node scripts/apply-editorial-feedback.mjs
            git -C "$state_dir" config user.name "daily-game-brief[bot]"
            git -C "$state_dir" config user.email "daily-game-brief[bot]@users.noreply.github.com"
            git -C "$state_dir" add automation/ledger/events.json
            if git -C "$state_dir" diff --cached --quiet; then
              success=true
              break
            fi
            git -C "$state_dir" commit -m "chore(automation): record $edition degraded outcomes"
            if git -C "$state_dir" push origin HEAD:automation/state; then
              success=true
              break
            fi
          done
          if [ "$success" != "true" ]; then
            echo "Failed to update automation/state after three attempts"
            exit 1
          fi

      - name: Open or update SLA incident
        if: steps.deadline.outputs.degraded_due == 'true' && steps.sla.outputs.status != 'healthy' && (steps.fallback.outputs.published != 'true' || steps.ledger_feedback.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Brief SLA incident: ${{ steps.sla.outputs.expected }}"
          existing="$(gh issue list --state open --search "$title in:title" --json url --jq '.[0].url // ""')"
          body="The scheduled edition did not reach a healthy deployed state by the degraded fallback deadline.\n\n- Expected: **${{ steps.sla.outputs.expected }}**\n- Status: **${{ steps.sla.outputs.status }}**\n- Local latest: **${{ steps.sla.outputs.local_latest }}**\n- Online latest: **${{ steps.sla.outputs.online_latest || 'unavailable' }}**\n- High-confidence omissions: **${{ steps.coverage.outputs.high_omissions || 'not available' }}**\n- Pages re-dispatched: **${{ steps.fallback.outputs.deploy_retriggered || 'false' }}**\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nThe fixed editorial window must not move during recovery."
          body="$body\n- Ledger feedback: **${{ steps.ledger_feedback.outcome || 'not run' }}**"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "automation" || gh issue create --title "$title" --body "$body"
          fi

      - name: Close resolved SLA incident
        if: steps.sla.outputs.status == 'healthy' || (steps.fallback.outputs.published == 'true' && steps.ledger_feedback.outcome != 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Brief SLA incident: ${{ steps.sla.outputs.expected }}"
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // ""')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The archive and deployed manifest now contain ${{ steps.sla.outputs.expected }}."
          fi

      - name: Write SLA summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Brief SLA"
            echo "- Expected: ${{ steps.sla.outputs.expected }}"
            echo "- Status: ${{ steps.sla.outputs.status }}"
            echo "- Degraded fallback due: ${{ steps.deadline.outputs.degraded_due || 'false' }}"
            echo "- Local latest: ${{ steps.sla.outputs.local_latest }}"
            echo "- Online latest: ${{ steps.sla.outputs.online_latest || 'unavailable' }}"
            echo "- Original packet: ${{ steps.packet.outputs.available || 'false' }}"
            echo "- Recovered packet: ${{ steps.recovery.outputs.available || 'false' }}"
            echo "- Usable packet: ${{ steps.packet_ready.outputs.available || 'false' }}"
            echo "- High-confidence omissions: ${{ steps.coverage.outputs.high_omissions || 'not available' }}"
            echo "- Review omissions: ${{ steps.coverage.outputs.review_omissions || 'not available' }}"
            echo "- Degraded fallback published: ${{ steps.fallback.outputs.published || 'false' }}"
            echo "- Pages re-dispatched: ${{ steps.fallback.outputs.deploy_retriggered || 'false' }}"
            echo "- Ledger feedback: ${{ steps.ledger_feedback.outcome || 'not run' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage audit
        if: always() && steps.packet_ready.outputs.available == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: coverage-audit-${{ steps.sla.outputs.expected }}-${{ github.run_id }}
          path: |
            artifacts/news-candidates.json
            artifacts/news-shadow-report.json
            artifacts/news-evidence.json
            artifacts/event-ledger.json
            artifacts/editorial-packet.json
            artifacts/news-coverage-audit.json
          if-no-files-found: warn
          retention-days: 14