name: Retry remaining AM media once

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/enrich-recent-two-2026-08-27.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Retry AM media enrichment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run media-enrichment.yml --repo "$GITHUB_REPOSITORY" --ref main -f edition_id=2026-08-27-am
