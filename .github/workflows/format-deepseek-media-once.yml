          path.write_text(text)
      - name: Check syntax
        run: node --check scripts/enrich-media.mjs
      - name: Commit formatting
        run: |
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add scripts/enrich-media.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(media): normalize DeepSeek fallback formatting"
          git push origin HEAD:codex/deepseek-media-search
