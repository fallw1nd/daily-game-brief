          throw new Error("searched page did not confirm the requested subject");
          }
          return { ...meta, pageUrl: result.url };''': '''  const meta = extractMeta(result.bytes.toString("utf8"), result.url);
          if (!meta) throw new Error("no usable social image metadata");
          if (source.webSearch && !pageMatchesRecord(record, source, meta, result.url)) {
            throw new Error("searched page did not confirm the requested subject");
          }
          return { ...meta, pageUrl: result.url };'''
          }
          # YAML literal block indentation is removed uniformly; normalize based on actual JS anchors too.
          text = text.replace('''  const titleTag = html.match(/<title\\b[^>]*>([\\s\\S]*?)<\\/title>/i)?.[1]
          ?.replace(/<[^>]+>/g, " ")
          .replace(/\\s+/g, " ")
