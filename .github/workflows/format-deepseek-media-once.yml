          # Actual generated blocks have zero indentation on continuation lines; repair them explicitly.
          text = text.replace('''  const titleTag = html.match(/<title\\b[^>]*>([\\s\\S]*?)<\\/title>/i)?.[1]
          ?.replace(/<[^>]+>/g, " ")''', '''  const titleTag = html.match(/<title\\b[^>]*>([\\s\\S]*?)<\\/title>/i)?.[1]
