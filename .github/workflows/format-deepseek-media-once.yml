name: Format DeepSeek media once

on:
  push:
    branches:
      - codex/deepseek-media-search
    paths:
      - .github/workflows/format-deepseek-media-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/deepseek-media-search
      - name: Normalize inserted indentation
        shell: python
