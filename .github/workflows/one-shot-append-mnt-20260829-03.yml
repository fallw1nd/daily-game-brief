name: Append MNT-20260829-03

on:
  push:
    branches:
      - docs/mnt-20260829-03-resolution
    paths:
      - .github/workflows/one-shot-append-mnt-20260829-03.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout maintenance branch
        uses: actions/checkout@v7
        with:
          ref: docs/mnt-20260829-03-resolution
          fetch-depth: 0

      - name: Append resolved maintenance entry and remove one-shot
        shell: bash
        run: |
          printf '%s' '' | base64 -d >> docs/MAINTENANCE_LOG.md
          rm .github/workflows/one-shot-append-mnt-20260829-03.yml
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add docs/MAINTENANCE_LOG.md .github/workflows/one-shot-append-mnt-20260829-03.yml
          git commit -m "docs(maintenance): record MNT-20260829-03 resolution"
          git push origin HEAD:docs/mnt-20260829-03-resolution
