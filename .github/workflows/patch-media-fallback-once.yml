name: Patch media fallback once

on:
  push:
    branches:
      - codex/media-subject-fallback
    paths:
      - .github/workflows/patch-media-fallback-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: codex/media-subject-fallback

      - name: Patch media search fallback
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("scripts/enrich-media.mjs")
          text = path.read_text()

          pattern = re.compile(
              r'  const titleParts = \[record\.title\?\.title_zh_cn, record\.title\?\.title_en\]\.filter\(Boolean\);\n'
              r'  const intent = kind === "cover"\n'
              r'    \? "game cover key art"\n'
              r'    : `\$\{record\.headline \|\| "game news"\} official screenshot`;'
          )
          replacement = '''  const titleParts = [record.title?.title_zh_cn, record.title?.title_en].filter(Boolean);
            const headline = record.headline || "game news";
            const personLed = /(interview|podcast|developer|designer|producer|director|采访|专访|访谈|播客|制作人|导演|设计师|开发者|编剧|创意总监|艺术总监)/i.test(headline);
            const intent = kind === "cover"
              ? "game cover key art"
              : personLed
                ? `${headline} interview developer designer producer portrait photo`
                : `${headline} official screenshot game cover key art`;'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit("media search intent block not found")

          old_audit = '  const audit = { generatedAt: new Date().toISOString(), apply: options.apply, editions: [] };'
          new_audit = '  const audit = { generatedAt: new Date().toISOString(), apply: options.apply, webSearchEnabled: Boolean(BRAVE_SEARCH_API_KEY), editions: [] };'
          if old_audit not in text:
            raise SystemExit("media audit block not found")
          text = text.replace(old_audit, new_audit, 1)

          old_log = '  console.log(`Media audit: ${flat.length} item(s); applied=${summary.applied?.length || 0}; candidate=${summary.candidate?.length || 0}; unavailable=${summary.unavailable?.length || 0}`);\n  console.log(`Report: ${REPORT_PATH}`);'
          new_log = '  console.log(`Media audit: ${flat.length} item(s); applied=${summary.applied?.length || 0}; candidate=${summary.candidate?.length || 0}; unavailable=${summary.unavailable?.length || 0}`);\n  console.log(`Web image search: ${BRAVE_SEARCH_API_KEY ? "enabled" : "disabled (BRAVE_SEARCH_API_KEY unavailable)"}`);\n  console.log(`Report: ${REPORT_PATH}`);'
          if old_log not in text:
            raise SystemExit("media summary block not found")
          text = text.replace(old_log, new_log, 1)

          path.write_text(text)

      - name: Check syntax
        run: node --check scripts/enrich-media.mjs

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add scripts/enrich-media.mjs
          git commit -m "fix(media): broaden subject image fallback"
          git push origin HEAD:codex/media-subject-fallback
