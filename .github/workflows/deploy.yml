name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Guard append-only archive
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          deleted="$(git diff --diff-filter=D --name-only "${{ github.event.before }}" "${{ github.sha }}" -- public/data/archive)"
          if [ -n "$deleted" ]; then
            echo "Archived editions are append-only:"
            echo "$deleted"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Acknowledge deployment outcome
        if: always()
        shell: bash
        run: |
          edition="$(node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('public/data/latest.json','utf8')); process.stdout.write(data.editionId || data.id || '')")"
          if [ -z "$edition" ]; then
            echo "Unable to resolve deployed edition from public/data/latest.json"
            exit 1
          fi
          if [ "${{ steps.deployment.outcome }}" = "success" ]; then
            bash scripts/update-edition-state-branch.sh \
              "$edition" deployment-succeeded \
              --main-sha="${{ github.sha }}" \
              --deployment-url="${{ steps.deployment.outputs.page_url }}"
          else
            bash scripts/update-edition-state-branch.sh \
              "$edition" deployment-failed \
              --main-sha="${{ github.sha }}" \
              --error="GitHub Pages deployment failed"
          fi
