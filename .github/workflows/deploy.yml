name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      edition_id:
        description: Optional exact edition whose deployment state should be acknowledged
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate requested edition
        id: request
        env:
          EDITION_ID: ${{ inputs.edition_id }}
        shell: bash
        run: |
          node --input-type=module - <<'NODE'
          import { readFileSync } from 'node:fs';
          import { editionStatePath } from './scripts/lib/edition-state.mjs';
          const edition = process.env.EDITION_ID;
          if (edition) {
            editionStatePath(edition);
            const manifest = JSON.parse(readFileSync('public/data/manifest.json', 'utf8'));
            if (!manifest.editions.some(item => item.id === edition)) {
              throw new Error(`Requested edition is not in this deployment: ${edition}`);
            }
          }
          NODE

      - name: Guard append-only archive
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          deleted="$(git diff --diff-filter=D --name-only "${{ github.event.before }}" "${{ github.sha }}" -- public/data/archive)"
          if [ -n "$deleted" ]; then
            echo "Archived editions are append-only:"
            echo "$deleted"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and build
        run: npm run check

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Hold Daily release until noon
        shell: bash
        run: |
          delay="$(node - <<'NODE'
          const fs = require('fs');
          const edition = JSON.parse(fs.readFileSync('public/data/latest.json', 'utf8'));
          if (edition.period !== 'daily' || typeof edition.plannedAt !== 'string') {
            process.stdout.write('0');
            process.exit(0);
          }
          const target = Date.parse(`${edition.plannedAt.replace(' ', 'T')}:00+08:00`);
          if (!Number.isFinite(target)) throw new Error(`Invalid Daily plannedAt: ${edition.plannedAt}`);
          process.stdout.write(String(Math.max(0, Math.ceil((target - Date.now()) / 1000))));
          NODE
          )"
          if [ "$delay" -gt 0 ]; then
            echo "Daily release is staged; waiting ${delay}s until plannedAt."
            sleep "$delay"
          fi

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Acknowledge successful deployment
        if: steps.deployment.outcome == 'success'
        env:
          EDITION_ID: ${{ inputs.edition_id }}
          DEPLOYED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          bash scripts/reconcile-deployment-state-branch.sh \
            --outcome=success --edition="$EDITION_ID" --main-sha="$DEPLOYED_SHA"

      - name: Acknowledge requested deployment failure
        if: always() && !cancelled() && steps.request.outcome == 'success' && steps.deployment.outcome != 'success' && github.event_name == 'workflow_dispatch' && inputs.edition_id != ''
        env:
          EDITION_ID: ${{ inputs.edition_id }}
          DEPLOYED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          bash scripts/reconcile-deployment-state-branch.sh \
            --outcome=failure --edition="$EDITION_ID" --main-sha="$DEPLOYED_SHA"
