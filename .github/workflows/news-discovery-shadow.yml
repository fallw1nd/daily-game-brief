name: Final editorial packet
run-name: Final editorial packet · ${{ github.event_name == 'push' && 'daily-wake' || (github.event_name == 'workflow_dispatch' && inputs.period || 'daily') }} · ${{ github.event_name == 'push' && github.ref_name || inputs.edition || 'scheduled' }}

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Edition period to evaluate
        required: true
        type: choice
        options:
          - am
          - pm
          - daily
      edition:
        description: Exact edition ID for recovery, for example 2026-09-01-daily
        required: true
        type: string
  push:
    branches:
      - "automation/editorial/*-daily"
    paths:
      - "automation/wake/*.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: news-discovery-state-${{ github.event_name == 'push' && 'daily' || (github.event_name == 'workflow_dispatch' && inputs.period || 'daily') }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      edition: ${{ steps.edition.outputs.edition }}
      period: ${{ steps.edition.outputs.period }}
      needed: ${{ steps.edition.outputs.needed }}
      revision_authorized: ${{ steps.edition.outputs.revision_authorized }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Open authorized same-edition revision cycle
        if: github.event_name == 'push'
        shell: bash
        run: |
          edition="${GITHUB_REF_NAME#automation/editorial/}"
          if ! [[ "$edition" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-daily$ ]]; then
            echo "Wake branch does not encode an exact Daily edition: $GITHUB_REF_NAME"
            exit 1
          fi
          wake_path="automation/wake/$edition.json"
          git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/daily-wake-source"
          git show "origin/daily-wake-source:$wake_path" > "$RUNNER_TEMP/daily-wake-preflight.json"
          wake_reason="$(EDITION_ID="$edition" node -e '
            const fs = require("node:fs");
            const wake = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/daily-wake-preflight.json", "utf8"));
            const edition = process.env.EDITION_ID;
            const allowed = new Set(["packet_missing_at_handoff", "user_authorized_same_edition_revision"]);
            if (wake.schemaVersion !== 1 || wake.editionId !== edition || wake.period !== "daily" || !allowed.has(wake.reason)) {
              throw new Error(`invalid Daily wake payload for ${edition}`);
            }
            process.stdout.write(wake.reason);
          ')"
          if [ "$wake_reason" = "user_authorized_same_edition_revision" ]; then
            bash scripts/update-edition-state-branch.sh \
              "$edition" revision-opened \
              --reason=user_authorized_same_edition_revision \
              --actor=user-authorized-acceptance
          fi

      - name: Select immutable due edition
        id: edition
        shell: bash
        run: |
          git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
          state_dir="$RUNNER_TEMP/edition-state-selection"
          git worktree add --detach "$state_dir" origin/automation/state
          echo "revision_authorized=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
            node scripts/resolve-packet-dispatch.mjs --period="$period" --edition="${{ inputs.edition }}" >> "$GITHUB_OUTPUT"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            period="daily"
            edition="${GITHUB_REF_NAME#automation/editorial/}"
            wake_path="automation/wake/$edition.json"
            git fetch origin "+refs/heads/$GITHUB_REF_NAME:refs/remotes/origin/daily-wake-source"
            git show "origin/daily-wake-source:$wake_path" > "$RUNNER_TEMP/daily-wake.json"
            wake_reason="$(EDITION_ID="$edition" node -e '
              const fs = require("node:fs");
              const wake = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/daily-wake.json", "utf8"));
              const edition = process.env.EDITION_ID;
              const allowed = new Set(["packet_missing_at_handoff", "user_authorized_same_edition_revision"]);
              if (wake.schemaVersion !== 1 || wake.editionId !== edition || wake.period !== "daily" || !allowed.has(wake.reason)) throw new Error(`invalid Daily wake payload for ${edition}`);
              process.stdout.write(wake.reason);
            ')"
            if [ "$wake_reason" = "user_authorized_same_edition_revision" ]; then
              state_path="$state_dir/automation/status/$edition.json"
              EDITION_ID="$edition" STATE_PATH="$state_path" node -e '
                const fs = require("node:fs");
                const state = JSON.parse(fs.readFileSync(process.env.STATE_PATH, "utf8"));
                if (state.editionId !== process.env.EDITION_ID || state.revisionRequest?.status !== "open" || state.revisionRequest?.reason !== "user_authorized_same_edition_revision" || state.packet?.status !== "pending") throw new Error(`durable revision authorization is not open for ${process.env.EDITION_ID}`);
              '
              echo "revision_authorized=true" >> "$GITHUB_OUTPUT"
            fi
            node scripts/resolve-packet-dispatch.mjs --period="$period" --edition="$edition" >> "$GITHUB_OUTPUT"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            period="daily"
            node scripts/resolve-due-edition.mjs --period="$period" --purpose=packet --status-root="$state_dir/automation/status" >> "$GITHUB_OUTPUT"
          fi
          git worktree remove --force "$state_dir"
          echo "period=$period" >> "$GITHUB_OUTPUT"

      - name: Collect final candidate snapshot
        if: steps.edition.outputs.needed != 'false'
        shell: bash
        run: BRIEF_NOW="${{ steps.edition.outputs.reference_now }}" node scripts/collect-news.mjs --period=${{ steps.edition.outputs.period }}

      - name: Restore previous automation ledgers
        shell: bash
        if: steps.edition.outputs.needed != 'false'
        run: |
          mkdir -p artifacts
          git fetch origin automation/state:refs/remotes/origin/automation/state || true
          git show origin/automation/state:automation/ledger/events.json > artifacts/event-ledger-previous.json || true
          git show origin/automation/state:automation/health/sources.json > artifacts/source-health-previous.json || true

      - name: Update persistent source health
        run: node scripts/update-source-health.mjs
        if: steps.edition.outputs.needed != 'false'

      - name: Update persistent event ledger
        run: node scripts/update-event-ledger.mjs
        if: steps.edition.outputs.needed != 'false'

      - name: Build bounded evidence packages
        run: node scripts/build-evidence.mjs
        if: steps.edition.outputs.needed != 'false'

      - name: Build title-only hints
        if: steps.edition.outputs.needed != 'false'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: node scripts/build-title-hints.mjs

      - name: Build bounded editorial request
        run: node scripts/editorialize.mjs
        if: steps.edition.outputs.needed != 'false'

      - name: Upload candidate evidence
        if: steps.edition.outcome == 'success' && steps.edition.outputs.needed != 'false' && always()
        uses: actions/upload-artifact@v6
        with:
          name: news-shadow-${{ steps.edition.outputs.period }}-${{ github.run_id }}
          path: |
            artifacts/news-candidates.json
            artifacts/news-shadow-report.json
            artifacts/source-health.json
            artifacts/news-evidence.json
            artifacts/title-hints.json
            artifacts/event-ledger.json
            artifacts/editorial-packet.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize discovery coverage
        if: steps.edition.outputs.needed != 'false' && always()
        shell: bash
        run: |
          if [ -f artifacts/news-shadow-report.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const report = require('./artifacts/news-shadow-report.json');
          const evidence = require('./artifacts/news-evidence.json');
          const titleHints = require('./artifacts/title-hints.json');
          const ledger = require('./artifacts/event-ledger.json');
          const health = require('./artifacts/source-health.json');
          console.log('## Final editorial packet');
          console.log(`- Window: ${report.window.windowStart} — ${report.window.windowEnd} Asia/Shanghai`);
          console.log(`- Active sources: ${report.totals.healthyActiveSources}/${report.totals.activeSources} healthy`);
          console.log(`- Shadow sources: ${report.totals.healthyShadowSources}/${report.totals.shadowSources} healthy; shadow candidates=${report.totals.shadowCandidates}`);
          console.log(`- Production candidates: ${report.totals.activeCandidates}; A=${report.totals.tierA}; B=${report.totals.tierB}`);
          console.log(`- Adjacent matches removed before review: ${report.totals.adjacentMatches}`);
          console.log(`- Evidence packages: ${evidence.totals.packages}; primary + independent=${evidence.totals.primaryPlusIndependent}; limited pages=${evidence.totals.limitedPages}`);
          console.log(`- Title hints: registry misses=${titleHints.registryMisses}; verified=${titleHints.hints.length}; limited=${titleHints.limited.length}`);
          console.log(`- Ledger: ${ledger.totals.events} retained events; recurring=${ledger.totals.recurring}`);
          console.log(`- Source health ledger: ${Object.keys(health.sources || {}).length} sources tracked`);
          console.log('- Shadow sources are observation-only and never enter the production evidence packet.');
          console.log('- Title hint sources are naming evidence only; the finalized packet does not modify archives or publish content.');
          NODE
          fi

      - name: Persist packet, ledgers, and durable acknowledgement
        id: persist
        if: steps.edition.outputs.needed != 'false'
        shell: bash
        run: |
          packet="$RUNNER_TEMP/editorial-packet.json"
          ledger="$RUNNER_TEMP/event-ledger.json"
          health="$RUNNER_TEMP/source-health.json"
          cp artifacts/editorial-packet.json "$packet"
          cp artifacts/event-ledger.json "$ledger"
          cp artifacts/source-health.json "$health"
          edition_id="${{ steps.edition.outputs.edition }}"
          period="${{ steps.edition.outputs.period }}"
          success=false
          for attempt in 1 2 3; do
            state_dir="$RUNNER_TEMP/packet-state-$attempt"
            git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
            git worktree add --detach "$state_dir" origin/automation/state
            mkdir -p "$state_dir/automation/packets" "$state_dir/automation/ledger" "$state_dir/automation/health"
            cp "$packet" "$state_dir/automation/packets/$edition_id.json"
            cp "$packet" "$state_dir/automation/packets/latest-$period.json"
            cp "$ledger" "$state_dir/automation/ledger/events.json"
            cp "$health" "$state_dir/automation/health/sources.json"
            node scripts/record-edition-state.mjs --state-root="$state_dir" --edition="$edition_id" --event=packet-ready --packet="$packet" --run-id="${{ github.run_id }}"
            git -C "$state_dir" config user.name "daily-game-brief[bot]"
            git -C "$state_dir" config user.email "daily-game-brief[bot]@users.noreply.github.com"
            git -C "$state_dir" add automation/packets automation/ledger/events.json automation/health/sources.json "automation/status/$edition_id.json"
            if git -C "$state_dir" diff --cached --quiet; then success=true; else
              git -C "$state_dir" commit -m "chore(automation): persist $edition_id packet acknowledgement"
              if git -C "$state_dir" push origin HEAD:automation/state; then success=true; fi
            fi
            git worktree remove --force "$state_dir"
            if [ "$success" = "true" ]; then break; fi
          done
          if [ "$success" != "true" ]; then exit 1; fi

  verify-after-handoff:
    needs: collect
    if: needs.collect.outputs.needed != 'false' && needs.collect.outputs.revision_authorized != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Wait until the fixed publication SLA
        shell: bash
        env:
          EDITION_ID: ${{ needs.collect.outputs.edition }}
          PERIOD: ${{ needs.collect.outputs.period }}
        run: |
          delay="$(node -e '
            const edition = process.env.EDITION_ID;
            const period = process.env.PERIOD;
            const date = edition.slice(0, 10);
            const targetTime = period === "pm" ? "09:50:00" : "03:00:00";
            const target = new Date(`${date}T${targetTime}Z`);
            process.stdout.write(String(Math.max(0, Math.ceil((target.getTime() - Date.now()) / 1000))));
          ')"
          sleep "$delay"

      - name: Dispatch exact-edition SLA verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          gh workflow run brief-sla-watchdog.yml --ref main -f period="${{ needs.collect.outputs.period }}" -f edition="${{ needs.collect.outputs.edition }}"
