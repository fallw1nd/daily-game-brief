name: Shadow news discovery

on:
  schedule:
    # Five minutes after each fixed Beijing cutoff. The report still uses 10:10/17:00.
    - cron: "15 2 * * *"
    - cron: "5 9 * * *"
  workflow_dispatch:
    inputs:
      period:
        description: Edition period to evaluate
        required: true
        type: choice
        options:
          - am
          - pm

permissions:
  contents: read

concurrency:
  group: news-discovery-shadow-${{ github.event.schedule || inputs.period }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Select fixed edition period
        id: edition
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            period="${{ inputs.period }}"
          elif [ "${{ github.event.schedule }}" = "15 2 * * *" ]; then
            period="am"
          else
            period="pm"
          fi
          echo "period=$period" >> "$GITHUB_OUTPUT"

      - name: Collect low-token candidate snapshot
        run: node scripts/collect-news.mjs --period=${{ steps.edition.outputs.period }}

      - name: Build bounded evidence packages
        run: node scripts/build-evidence.mjs

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: news-shadow-${{ steps.edition.outputs.period }}-${{ github.run_id }}
          path: |
            artifacts/news-candidates.json
            artifacts/news-shadow-report.json
            artifacts/news-evidence.json
          if-no-files-found: error
          retention-days: 14

      - name: Summarize discovery coverage
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/news-shadow-report.json ]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const report = require('./artifacts/news-shadow-report.json');
          const evidence = require('./artifacts/news-evidence.json');
          console.log('## Shadow discovery');
          console.log(`- Window: ${report.window.windowStart} — ${report.window.windowEnd} Asia/Shanghai`);
          console.log(`- Sources: ${report.totals.healthySources}/${report.totals.sources} healthy`);
          console.log(`- Candidates: ${report.totals.candidates} total; A=${report.totals.tierA}; B=${report.totals.tierB}`);
          console.log(`- Adjacent matches removed before review: ${report.totals.adjacentMatches}`);
          console.log(`- Evidence packages: ${evidence.totals.packages}; primary + independent=${evidence.totals.primaryPlusIndependent}; limited pages=${evidence.totals.limitedPages}`);
          console.log('- Shadow mode does not modify archives or publish content.');
          NODE
          fi
