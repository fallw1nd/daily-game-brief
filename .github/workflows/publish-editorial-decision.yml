name: Publish editorial decision

on:
  push:
    branches:
      - "automation/editorial/**"
      - "automation/locale/en/**"
    paths:
      - "automation/inbox/*.json"
      - "automation/locale-inbox/*.json"
  workflow_dispatch:
    inputs:
      edition_id:
        description: Exact edition ID whose committed editorial decision should be published or repaired
        required: true
        type: string
      publication_mode:
        description: Trusted publisher mode
        required: true
        default: publish
        type: choice
        options:
          - publish
          - locale-repair

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: editorial-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted publisher from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore submitted decision and immutable packet
        id: submission
        shell: bash
        run: |
          locale_draft=false
          locale_repair_path=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            edition="${{ inputs.edition_id }}"
            mode="${{ inputs.publication_mode }}"
            branch="automation/editorial/$edition"
          else
            branch="$GITHUB_REF_NAME"
            if [[ "$branch" =~ ^automation/locale/en/([0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm|daily))$ ]]; then
              edition="${BASH_REMATCH[1]}"
              mode="locale-repair"
              locale_draft=true
              locale_repair_path="artifacts/locale-repair.json"
            elif [[ "$branch" =~ ^automation/editorial/([0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm|daily))$ ]]; then
              edition="${BASH_REMATCH[1]}"
              mode="publish"
            else
              echo "Invalid publication branch: $branch"
              exit 1
            fi
          fi
          if [[ ! "$edition" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm|daily)$ ]]; then
            echo "Invalid edition: $edition"
            exit 1
          fi
          if [ "$mode" != "publish" ] && [ "$mode" != "locale-repair" ]; then
            echo "Invalid publication mode: $mode"
            exit 1
          fi
          if [ "$locale_draft" = "true" ] && [ "$branch" != "automation/locale/en/$edition" ]; then
            echo "Locale repair branch does not match edition: $branch / $edition"
            exit 1
          fi
          if [ "$locale_draft" != "true" ] && [ "$branch" != "automation/editorial/$edition" ]; then
            echo "Editorial branch does not match edition: $branch / $edition"
            exit 1
          fi
          mkdir -p artifacts
          git fetch origin "$branch:refs/remotes/origin/$branch"
          decided_at="$(git show -s --format=%cI "refs/remotes/origin/$branch")"
          submission_sha="$(git rev-parse "refs/remotes/origin/$branch")"
          packet_sha=""
          if [ "$locale_draft" = "true" ]; then
            git show "refs/remotes/origin/$branch:automation/locale-inbox/$edition.json" > "$locale_repair_path"
            repair_edition="$(node -p "JSON.parse(require('fs').readFileSync('$locale_repair_path','utf8')).editionId || ''")"
            if [ "$repair_edition" != "$edition" ]; then
              echo "Locale repair payload edition mismatch: $repair_edition / $edition"
              exit 1
            fi
          else
            git show "refs/remotes/origin/$branch:automation/inbox/$edition.json" > artifacts/editorial-decisions.json
            packet_sha="$(node -p "JSON.parse(require('fs').readFileSync('artifacts/editorial-decisions.json','utf8')).packetBlobSha || ''")"
            git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
            if [[ "$packet_sha" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$packet_sha^{blob}"; then
              git cat-file blob "$packet_sha" > artifacts/editorial-packet.json
            elif [ "$mode" = "locale-repair" ]; then
              git show "refs/remotes/origin/automation/state:automation/packets/$edition.json" > artifacts/editorial-packet.json
              packet_sha="$(git hash-object artifacts/editorial-packet.json)"
            else
              echo "Decision does not reference a fetchable immutable packet blob: $packet_sha"
              exit 1
            fi
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "decided_at=$decided_at" >> "$GITHUB_OUTPUT"
          echo "submission_sha=$submission_sha" >> "$GITHUB_OUTPUT"
          echo "packet_blob_sha=$packet_sha" >> "$GITHUB_OUTPUT"
          echo "locale_draft=$locale_draft" >> "$GITHUB_OUTPUT"
          echo "locale_repair_path=$locale_repair_path" >> "$GITHUB_OUTPUT"

      - name: Acknowledge submitted editorial decision
        if: steps.submission.outputs.mode == 'publish'
        shell: bash
        run: |
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.submission.outputs.edition }}" editorial-submitted \
            --packet-blob-sha="${{ steps.submission.outputs.packet_blob_sha }}" \
            --submission-sha="${{ steps.submission.outputs.submission_sha }}"

      - name: Validate evidence-bounded submission
        id: validation
        continue-on-error: true
        env:
          EDITORIAL_BRANCH: ${{ steps.submission.outputs.branch }}
          PUBLICATION_MODE: ${{ steps.submission.outputs.mode }}
          LOCALE_REPAIR_DRAFT_PATH: ${{ steps.submission.outputs.locale_repair_path }}
        shell: bash
        run: |
          if [ "${{ steps.submission.outputs.locale_draft }}" = "true" ]; then
            node scripts/validate-locale-repair.mjs
          else
            node scripts/validate-editorial-submission.mjs
          fi

      - name: Persist machine-readable validation result
        if: steps.submission.outputs.mode == 'publish' && always()
        shell: bash
        run: |
          if [ "${{ steps.validation.outcome }}" = "success" ]; then
            event=editorial-valid
          else
            event=editorial-invalid
          fi
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.submission.outputs.edition }}" "$event" \
            --packet-blob-sha="${{ steps.submission.outputs.packet_blob_sha }}" \
            --submission-sha="${{ steps.submission.outputs.submission_sha }}" \
            --validation=artifacts/editorial-validation.json

      - name: Upload editorial validation result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: editorial-validation-${{ steps.submission.outputs.edition }}-${{ github.run_id }}
          path: artifacts/editorial-validation.json
          if-no-files-found: warn
          retention-days: 14

      - name: Stop invalid editorial submission
        if: steps.validation.outcome != 'success'
        run: |
          echo "Editorial or locale decision is invalid; publication was stopped."
          exit 1

      - name: Build and validate publication
        id: build
        env:
          PUBLICATION_MODE: ${{ steps.submission.outputs.mode }}
          LOCALE_REPAIR_DRAFT_PATH: ${{ steps.submission.outputs.locale_repair_path }}
        shell: bash
        run: |
          git pull --ff-only origin main
          node scripts/publish-editorial-decision.mjs
          npm run check

      - name: Publish atomically
        id: publication
        env:
          PUBLICATION_MODE: ${{ steps.submission.outputs.mode }}
          LOCALE_REPAIR_DRAFT_PATH: ${{ steps.submission.outputs.locale_repair_path }}
        shell: bash
        run: |
          edition="${{ steps.submission.outputs.edition }}"
          mode="${{ steps.submission.outputs.mode }}"
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"

          record_result() {
            feedback_eligible="$(node -p "JSON.parse(require('fs').readFileSync('artifacts/publication-result.json','utf8')).feedbackEligible")"
            locale_status="$(node -p "JSON.parse(require('fs').readFileSync('artifacts/publication-result.json','utf8')).localeStatus || 'unresolved'")"
            locale_reason="$(node -p "JSON.parse(require('fs').readFileSync('artifacts/publication-result.json','utf8')).localeReasonCode || ''")"
            publication_status="$(node -p "JSON.parse(require('fs').readFileSync('artifacts/publication-result.json','utf8')).status || 'unresolved'")"
            echo "feedback_eligible=$feedback_eligible" >> "$GITHUB_OUTPUT"
            echo "locale_status=$locale_status" >> "$GITHUB_OUTPUT"
            echo "locale_reason=$locale_reason" >> "$GITHUB_OUTPUT"
            echo "publication_status=$publication_status" >> "$GITHUB_OUTPUT"
          }

          for attempt in 1 2 3; do
            if git diff --quiet -- public/data; then
              record_result
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add public/data
            if [ "$mode" = "locale-repair" ]; then
              git commit -m "fix(i18n): repair English locale for $edition"
            else
              git commit -m "content(brief): publish $edition"
            fi
            if git push origin HEAD:main; then
              record_result
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              break
            fi

            echo "main advanced during publication; rebuilding $edition/$mode from current main (attempt $((attempt + 1))/3)"
            git fetch origin main
            git reset --hard origin/main
            PUBLICATION_MODE="$mode" LOCALE_REPAIR_DRAFT_PATH="${{ steps.submission.outputs.locale_repair_path }}" node scripts/publish-editorial-decision.mjs
            npm run check
          done

          echo "Failed to publish $edition/$mode after three rebuild attempts"
          exit 1

      - name: Acknowledge committed Canonical and locale lane
        if: steps.submission.outputs.mode == 'publish' && steps.publication.outcome == 'success'
        shell: bash
        run: |
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.submission.outputs.edition }}" publication-committed \
            --main-sha="${{ steps.publication.outputs.commit }}" \
            --source=editorial
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.submission.outputs.edition }}" locale-status \
            --status="${{ steps.publication.outputs.locale_status }}" \
            --reason="${{ steps.publication.outputs.locale_reason }}"

      - name: Acknowledge repaired English locale
        if: steps.submission.outputs.mode == 'locale-repair' && steps.publication.outcome == 'success' && steps.publication.outputs.locale_status == 'available'
        shell: bash
        run: |
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.submission.outputs.edition }}" locale-status \
            --status=available \
            --reason=locale-repaired

      - name: Record publication failure state
        if: failure() && steps.validation.outcome == 'success' && steps.submission.outputs.mode == 'publish' && steps.publication.outcome == 'failure'
        shell: bash
        run: |
          bash scripts/update-edition-state-branch.sh \
            "${{ steps.submission.outputs.edition }}" publication-failed \
            --error="trusted publisher failed after validation"

      - name: Record degraded English incident
        if: steps.publication.outputs.locale_status == 'unavailable'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          edition="${{ steps.submission.outputs.edition }}"
          reason="${{ steps.publication.outputs.locale_reason }}"
          title="English locale degraded: $edition"
          body="Canonical Simplified Chinese publication succeeded, but the English presentation overlay was rejected or missing.\n\n- Edition: **$edition**\n- Reason: **$reason**\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nThe canonical archive remains authoritative. Repair must use the trusted publisher's locale-repair mode and must not modify canonical publication files."
          existing="$(gh issue list --state open --search "$title in:title" --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "automation" || gh issue create --title "$title" --body "$body"
          fi

      - name: Close repaired English incident
        if: steps.publication.outputs.locale_status == 'available'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          edition="${{ steps.submission.outputs.edition }}"
          title="English locale degraded: $edition"
          number="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // ""')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "English locale is available after trusted locale repair. Canonical publication remained unchanged."
          fi

      - name: Trigger Pages deployment
        if: steps.publication.outputs.changed == 'true' || (github.event_name == 'workflow_dispatch' && steps.submission.outputs.mode == 'publish')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Trigger edition-specific media workflow
        if: steps.submission.outputs.mode == 'publish' && (steps.publication.outputs.changed == 'true' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run media-enrichment.yml --ref main -f edition_id=${{ steps.submission.outputs.edition }}

      - name: Write editorial outcomes to persistent ledger
        id: ledger_feedback
        if: steps.publication.outputs.feedback_eligible == 'true'
        env:
          EDITORIAL_DECIDED_AT: ${{ steps.submission.outputs.decided_at }}
        shell: bash
        run: |
          success=false
          for attempt in 1 2 3; do
            state_dir="$RUNNER_TEMP/editorial-ledger-$attempt"
            git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
            git worktree add --detach "$state_dir" origin/automation/state
            EVENT_LEDGER_PATH="$state_dir/automation/ledger/events.json" node scripts/apply-editorial-feedback.mjs
            git -C "$state_dir" config user.name "daily-game-brief[bot]"
            git -C "$state_dir" config user.email "daily-game-brief[bot]@users.noreply.github.com"
            git -C "$state_dir" add automation/ledger/events.json
            if git -C "$state_dir" diff --cached --quiet; then
              echo "updated=false" >> "$GITHUB_OUTPUT"
              success=true
              break
            fi
            git -C "$state_dir" commit -m "chore(automation): record ${{ steps.submission.outputs.edition }} editorial outcomes"
            if git -C "$state_dir" push origin HEAD:automation/state; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              success=true
              break
            fi
          done
          if [ "$success" != "true" ]; then
            echo "Failed to update automation/state after three attempts"
            exit 1
          fi

      - name: Retry a validated failed publication once
        if: failure() && github.event_name != 'workflow_dispatch' && steps.validation.outcome == 'success' && steps.submission.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run publish-editorial-decision.yml --ref main -f edition_id=${{ steps.submission.outputs.edition }} -f publication_mode=publish
          echo "Queued one idempotent workflow_dispatch retry for ${{ steps.submission.outputs.edition }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Report publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Editorial publication failed: ${{ steps.submission.outputs.edition || github.ref_name }}"
          body="The evidence-bounded editorial or locale submission failed before a verified publication.\n\n- Branch: **${{ steps.submission.outputs.branch || github.ref_name }}**\n- Mode: **${{ steps.submission.outputs.mode || 'unresolved' }}**\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n- Automatic retry: **${{ steps.submission.outputs.mode == 'publish' && github.event_name != 'workflow_dispatch' && 'requested when validation succeeded' || 'not used for locale-only repair' }}**\n\nThe fixed editorial window, Canonical facts, and issue numbering must be preserved during recovery."
          existing="$(gh issue list --state open --search "$title in:title" --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "automation" || gh issue create --title "$title" --body "$body"
          fi

      - name: Summarize publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Editorial publication"
            echo "- Edition: ${{ steps.submission.outputs.edition || 'unresolved' }}"
            echo "- Decision branch: ${{ steps.submission.outputs.branch || github.ref_name }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Mode: ${{ steps.submission.outputs.mode || 'unresolved' }}"
            echo "- Publication status: ${{ steps.publication.outputs.publication_status || 'unresolved' }}"
            echo "- Canonical/data changed: ${{ steps.publication.outputs.changed || 'false' }}"
            echo "- English locale: ${{ steps.publication.outputs.locale_status || 'unresolved' }}"
            echo "- English reason: ${{ steps.publication.outputs.locale_reason || 'none' }}"
            echo "- Main commit: ${{ steps.publication.outputs.commit || 'unchanged' }}"
            echo "- Ledger updated: ${{ steps.ledger_feedback.outputs.updated || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
