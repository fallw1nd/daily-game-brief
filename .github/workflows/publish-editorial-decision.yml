name: Publish editorial decision

on:
  push:
    branches:
      - "automation/editorial/**"
    paths:
      - "automation/inbox/*.json"
  workflow_dispatch:
    inputs:
      edition_id:
        description: Exact edition ID whose committed editorial decision should be retried
        required: true
        type: string

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: editorial-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted publisher from main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore submitted decision and matching packet
        id: submission
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            edition="${{ inputs.edition_id }}"
            branch="automation/editorial/$edition"
          else
            branch="$GITHUB_REF_NAME"
            edition="${branch#automation/editorial/}"
          fi
          if [[ ! "$edition" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-(am|pm)$ ]] || [ "$branch" != "automation/editorial/$edition" ]; then
            echo "Invalid editorial branch or edition: $branch / $edition"
            exit 1
          fi
          mkdir -p artifacts
          git fetch origin "$branch:refs/remotes/origin/$branch"
          git show "refs/remotes/origin/$branch:automation/inbox/$edition.json" > artifacts/editorial-decisions.json
          decided_at="$(git show -s --format=%cI "refs/remotes/origin/$branch")"
          git fetch origin automation/state:refs/remotes/origin/automation/state
          git show "refs/remotes/origin/automation/state:automation/packets/$edition.json" > artifacts/editorial-packet.json
          echo "edition=$edition" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "decided_at=$decided_at" >> "$GITHUB_OUTPUT"

      - name: Validate evidence-bounded submission
        id: validation
        env:
          EDITORIAL_BRANCH: ${{ steps.submission.outputs.branch }}
        run: node scripts/validate-editorial-submission.mjs

      - name: Build and validate edition
        id: build
        shell: bash
        run: |
          git pull --ff-only origin main
          node scripts/publish-editorial-decision.mjs
          npm run check

      - name: Publish edition atomically
        id: publication
        shell: bash
        run: |
          edition="${{ steps.submission.outputs.edition }}"
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"

          record_feedback() {
            feedback_eligible="$(node -p "JSON.parse(require('fs').readFileSync('artifacts/publication-result.json','utf8')).feedbackEligible")"
            echo "feedback_eligible=$feedback_eligible" >> "$GITHUB_OUTPUT"
          }

          for attempt in 1 2 3; do
            if git diff --quiet -- public/data; then
              record_feedback
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git add public/data
            git commit -m "content(brief): publish $edition"
            if git push origin HEAD:main; then
              record_feedback
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [ "$attempt" -eq 3 ]; then
              break
            fi

            echo "main advanced during publication; rebuilding $edition from current main (attempt $((attempt + 1))/3)"
            git fetch origin main
            git reset --hard origin/main
            node scripts/publish-editorial-decision.mjs
            npm run check
          done

          echo "Failed to publish $edition after three rebuild attempts"
          exit 1

      - name: Trigger Pages and edition-specific media workflows
        if: steps.publication.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run deploy.yml --ref main
          gh workflow run media-enrichment.yml --ref main -f edition_id=${{ steps.submission.outputs.edition }}

      - name: Write editorial outcomes to persistent ledger
        id: ledger_feedback
        if: steps.publication.outputs.feedback_eligible == 'true'
        env:
          EDITORIAL_DECIDED_AT: ${{ steps.submission.outputs.decided_at }}
        shell: bash
        run: |
          success=false
          for attempt in 1 2 3; do
            state_dir="$RUNNER_TEMP/editorial-ledger-$attempt"
            git fetch origin +refs/heads/automation/state:refs/remotes/origin/automation/state
            git worktree add --detach "$state_dir" origin/automation/state
            EVENT_LEDGER_PATH="$state_dir/automation/ledger/events.json" node scripts/apply-editorial-feedback.mjs
            git -C "$state_dir" config user.name "daily-game-brief[bot]"
            git -C "$state_dir" config user.email "daily-game-brief[bot]@users.noreply.github.com"
            git -C "$state_dir" add automation/ledger/events.json
            if git -C "$state_dir" diff --cached --quiet; then
              echo "updated=false" >> "$GITHUB_OUTPUT"
              success=true
              break
            fi
            git -C "$state_dir" commit -m "chore(automation): record ${{ steps.submission.outputs.edition }} editorial outcomes"
            if git -C "$state_dir" push origin HEAD:automation/state; then
              echo "updated=true" >> "$GITHUB_OUTPUT"
              success=true
              break
            fi
          done
          if [ "$success" != "true" ]; then
            echo "Failed to update automation/state after three attempts"
            exit 1
          fi

      - name: Retry a validated failed publication once
        if: failure() && github.event_name != 'workflow_dispatch' && steps.validation.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run publish-editorial-decision.yml --ref main -f edition_id=${{ steps.submission.outputs.edition }}
          echo "Queued one idempotent workflow_dispatch retry for ${{ steps.submission.outputs.edition }}." >> "$GITHUB_STEP_SUMMARY"

      - name: Report publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title="Editorial publication failed: ${{ steps.submission.outputs.edition || github.ref_name }}"
          body="The evidence-bounded editorial submission failed before a verified publication.\n\n- Branch: **${{ steps.submission.outputs.branch || github.ref_name }}**\n- Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n- Automatic retry: **${{ github.event_name == 'workflow_dispatch' && 'already consumed' || 'requested when validation succeeded' }}**\n\nThe fixed editorial window and issue numbering must be preserved during recovery."
          existing="$(gh issue list --state open --search "$title in:title" --json url --jq '.[0].url // ""')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label "automation" || gh issue create --title "$title" --body "$body"
          fi

      - name: Summarize publication
        if: always()
        shell: bash
        run: |
          {
            echo "## Editorial publication"
            echo "- Edition: ${{ steps.submission.outputs.edition || 'unresolved' }}"
            echo "- Decision branch: ${{ steps.submission.outputs.branch || github.ref_name }}"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Data changed: ${{ steps.publication.outputs.changed || 'false' }}"
            echo "- Main commit: ${{ steps.publication.outputs.commit || 'unchanged' }}"
            echo "- Ledger updated: ${{ steps.ledger_feedback.outputs.updated || 'false' }}"
          } >> "$GITHUB_STEP_SUMMARY"
