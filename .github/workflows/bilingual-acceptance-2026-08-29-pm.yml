name: Bilingual evening acceptance 2026-08-29-pm

on:
  push:
    branches:
      - "automation/acceptance-bilingual-2026-08-29-pm"
    paths:
      - ".github/workflows/bilingual-acceptance-2026-08-29-pm.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout proposed trusted fix
        uses: actions/checkout@v7
        with:
          ref: fix/i18n-upcoming-bootstrap
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore finalized packet and acceptance copy
        shell: bash
        run: |
          mkdir -p artifacts
          git fetch origin automation/state:refs/remotes/origin/automation/state
          git show origin/automation/state:automation/packets/2026-08-29-pm.json > artifacts/editorial-packet.json
          git fetch origin automation/acceptance-bilingual-2026-08-29-pm:refs/remotes/origin/automation/acceptance-bilingual-2026-08-29-pm
          git show origin/automation/acceptance-bilingual-2026-08-29-pm:automation/acceptance/2026-08-29-pm/english-copy.json > artifacts/acceptance-english.json
          cp public/data/archive/2026/08/2026-08-29-pm.json artifacts/production-target.json

      - name: Build contract v2 replay and isolated pre-evening baseline
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, rmSync } from 'node:fs';
          import { resolve } from 'node:path';

          const packet = JSON.parse(readFileSync('artifacts/editorial-packet.json', 'utf8'));
          const target = JSON.parse(readFileSync('artifacts/production-target.json', 'utf8'));
          const draft = JSON.parse(readFileSync('artifacts/acceptance-english.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('public/data/manifest.json', 'utf8'));
          const packages = packet.editorialInput.packages || [];

          if (packet.editorialInput.window.id !== '2026-08-29-pm') throw new Error('wrong packet edition');
          if (target.id !== '2026-08-29-pm' || target.issueNumber !== 18) throw new Error('production target is not issue 18');
          if (draft.editionId !== target.id) throw new Error('acceptance copy edition mismatch');

          const normalized = (value) => String(value || '').replace(/\/$/, '');
          const packageForEntry = (entry) => {
            const entryUrls = new Set((entry.sources || []).map((source) => normalized(source.url)));
            return packages.find((pkg) => (pkg.sources || []).some((source) => entryUrls.has(normalized(source.url)) || entryUrls.has(normalized(source.canonicalUrl))));
          };

          const entryByEvent = new Map();
          for (const entry of target.entries || []) {
            const pkg = packageForEntry(entry);
            if (!pkg) throw new Error(`cannot map production entry ${entry.id} back to packet`);
            if (entryByEvent.has(pkg.eventKey)) throw new Error(`duplicate event mapping ${pkg.eventKey}`);
            entryByEvent.set(pkg.eventKey, entry);
          }

          const emptyFrame = () => ({
            subjectTitleKey: null,
            dates: [],
            times: [],
            numbers: [],
            platforms: [],
            peopleAndEntities: [],
            versionsAndTerms: [],
          });

          const decisions = packages.map((pkg) => {
            const entry = entryByEvent.get(pkg.eventKey);
            if (!entry) {
              return {
                eventKey: pkg.eventKey,
                decision: 'exclude',
                section: null,
                titleKey: null,
                titleZhCn: null,
                titleEn: null,
                titleZhStatus: null,
                headline: null,
                summary: null,
                factStatus: null,
                timeStatus: null,
                entryFlags: [],
                tracking: false,
                verification: 'Acceptance replay exclusion; this candidate is absent from the production canonical sample.',
                reason: 'Excluded in the acceptance replay because it was not selected in the production canonical edition.',
                beijingTime: null,
                timeNote: null,
                platforms: [],
                region: null,
                releaseType: null,
                sourceIndexes: [],
                additionalSources: [],
                sharedFactFrame: emptyFrame(),
              };
            }

            const titleKey = entry.title?.title_key || null;
            const copy = draft.entries?.[titleKey];
            if (!copy) throw new Error(`missing acceptance English/shared fact copy for ${titleKey}`);
            const sourceIndexes = (entry.sources || []).map((entrySource) => {
              const index = (pkg.sources || []).findIndex((source) => normalized(source.url) === normalized(entrySource.url) || normalized(source.canonicalUrl) === normalized(entrySource.url));
              if (index < 0) throw new Error(`cannot map source for ${entry.id}`);
              return index;
            });

            return {
              eventKey: pkg.eventKey,
              decision: 'include',
              section: entry.section,
              titleKey,
              titleZhCn: entry.title?.title_zh_cn ?? null,
              titleEn: entry.title?.title_en ?? null,
              titleZhStatus: entry.title?.title_zh_status ?? null,
              headline: entry.headline,
              summary: entry.summary,
              factStatus: entry.fact_status,
              timeStatus: entry.time_status,
              entryFlags: entry.entry_flags || [],
              tracking: Boolean(entry.tracking),
              verification: entry.verification,
              reason: 'Acceptance replay of the production editorial selection using the same finalized packet evidence.',
              beijingTime: entry.beijingTime ?? null,
              timeNote: entry.timeNote ?? null,
              platforms: entry.platforms || [],
              region: entry.region ?? null,
              releaseType: entry.releaseType ?? null,
              sourceIndexes,
              additionalSources: [],
              sharedFactFrame: copy.sharedFactFrame,
            };
          });

          const targetIndex = manifest.editions.findIndex((item) => item.id === target.id);
          if (targetIndex !== manifest.editions.length - 1) throw new Error('acceptance target must be current latest edition');
          if (targetIndex < 1) throw new Error('acceptance target has no previous edition');
          const previousItem = manifest.editions[targetIndex - 1];
          const previousText = readFileSync(resolve('public/data', previousItem.path), 'utf8');
          const previous = JSON.parse(previousText);

          const stripUpcoming = (item) => ({
            id: item.id,
            date: item.date,
            titleKey: item.title?.title_key,
            titleZhCn: item.title?.title_zh_cn ?? null,
            titleEn: item.title?.title_en,
            titleZhStatus: item.title?.title_zh_status,
            platforms: item.platforms || [],
            region: item.region,
            releaseType: item.releaseType,
            source: item.source,
            note: item.note,
          });
          const previousUpcoming = new Map((previous.upcoming || []).map((item) => [item.id, stripUpcoming(item)]));
          const targetUpcoming = new Map((target.upcoming || []).map((item) => [item.id, stripUpcoming(item)]));
          const upcoming = [];
          for (const [id, item] of targetUpcoming) {
            const before = previousUpcoming.get(id);
            if (!before || JSON.stringify(before) !== JSON.stringify(item)) upcoming.push(item);
          }
          const removeUpcomingIds = [...previousUpcoming.keys()].filter((id) => !targetUpcoming.has(id));

          const included = decisions.filter((item) => item.decision === 'include');
          const englishEntries = included.map((decision) => {
            const copy = draft.entries[decision.titleKey];
            const pkg = packages.find((item) => item.eventKey === decision.eventKey);
            return {
              eventKey: decision.eventKey,
              headline: copy.headline,
              summary: copy.summary,
              verification: copy.verification,
              timeNote: copy.timeNote,
              regionLabel: copy.regionLabel,
              releaseTypeLabel: copy.releaseTypeLabel,
              sourceLabels: decision.sourceIndexes.map((sourceIndex) => ({ sourceIndex, label: pkg.sources[sourceIndex].label })),
            };
          });
          const englishUpcoming = upcoming.map((item) => ({
            upcomingId: item.id,
            regionLabel: null,
            releaseTypeLabel: null,
            sourceLabel: null,
            coverAlt: null,
          }));

          const leadEntry = (target.entries || []).find((entry) => entry.id === target.leadEntryId) || target.entries?.[0];
          const leadPackage = leadEntry ? packageForEntry(leadEntry) : null;
          if (!leadPackage) throw new Error('cannot resolve lead event key');

          const editorial = {
            contractVersion: 2,
            editionId: target.id,
            archiveTitle: target.archiveTitle,
            leadEventKey: leadPackage.eventKey,
            decisions,
            upcomingMode: 'inherit_and_patch',
            removeUpcomingIds,
            upcoming,
            locales: {
              en: {
                schemaVersion: 1,
                locale: 'en',
                archiveTitle: draft.englishArchiveTitle,
                entries: englishEntries,
                upcoming: englishUpcoming,
                sourceReport: {
                  checked: [],
                  limited: [],
                  note: 'Acceptance replay uses only the finalized production packet and adds no supplemental event discovery.',
                },
              },
            },
            checkedExtra: [],
            limitedExtra: [],
            editorialNote: 'Isolated bilingual acceptance replay of the already-published 2026-08-29 evening edition.',
          };
          writeFileSync('artifacts/editorial-decisions.json', JSON.stringify(editorial, null, 2) + '\n');

          const baselineManifest = {
            ...manifest,
            updatedAt: previous.generatedAt,
            latest: previous.id,
            editions: manifest.editions.slice(0, targetIndex),
          };
          writeFileSync('public/data/manifest.json', JSON.stringify(baselineManifest, null, 2) + '\n');
          writeFileSync('public/data/latest.json', previousText);
          rmSync(resolve('public/data', manifest.editions[targetIndex].path), { force: true });
          const [year, month] = target.id.split('-');
          rmSync(resolve('public/data/locales/en/archive', year, month, `${target.id}.json`), { force: true });
          rmSync(resolve('public/data/locales/en/status', year, month, `${target.id}.json`), { force: true });

          console.log(`Acceptance decision built: ${included.length} include / ${decisions.length - included.length} exclude; upcoming patches=${upcoming.length}; removals=${removeUpcomingIds.length}`);
          NODE

      - name: Validate exact evidence-bounded contract v2 submission
        env:
          EDITORIAL_BRANCH: automation/editorial/2026-08-29-pm
        run: node scripts/validate-editorial-submission.mjs

      - name: Rebuild evening edition with proposed trusted publisher
        env:
          BRIEF_NOW: 2026-08-29T11:25:18.043Z
          PUBLICATION_MODE: publish
        run: node scripts/publish-editorial-decision.mjs

      - name: Run full repository gate on isolated output
        run: npm run check

      - name: Produce acceptance report
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { factsDigest, canonicalCopyDigest, localeDigest } from './scripts/lib/locale-digest.mjs';

          const generated = JSON.parse(readFileSync('public/data/archive/2026/08/2026-08-29-pm.json', 'utf8'));
          const production = JSON.parse(readFileSync('artifacts/production-target.json', 'utf8'));
          const result = JSON.parse(readFileSync('artifacts/publication-result.json', 'utf8'));
          const overlayPath = 'public/data/locales/en/archive/2026/08/2026-08-29-pm.json';
          const overlay = existsSync(overlayPath) ? JSON.parse(readFileSync(overlayPath, 'utf8')) : null;
          const localeIndex = JSON.parse(readFileSync('public/data/locales/en/index.json', 'utf8'));
          const localeItem = (localeIndex.editions || []).find((item) => item.id === generated.id || item.editionId === generated.id);

          const generatedFacts = factsDigest(generated);
          const productionFacts = factsDigest(production);
          const generatedCopy = canonicalCopyDigest(generated);
          const productionCopy = canonicalCopyDigest(production);
          const checks = {
            editionId: generated.id === '2026-08-29-pm',
            issueNumber: generated.issueNumber === 18,
            fixedWindow: generated.plannedAt === '2026-08-29 17:00' && generated.windowStart === '2026-08-29 10:10' && generated.windowEnd === '2026-08-29 17:00',
            entryCount: generated.entries?.length === production.entries?.length,
            factsMatchProduction: generatedFacts === productionFacts,
            canonicalCopyMatchesProduction: generatedCopy === productionCopy,
            englishAvailable: result.localeStatus === 'available' && Boolean(overlay),
            englishCoversAllEntries: overlay?.entries?.length === generated.entries?.length,
            overlayFactsBound: overlay?.factsDigest === generatedFacts,
            overlayCopyBound: overlay?.canonicalCopyDigest === generatedCopy,
            overlayDigestValid: Boolean(overlay) && overlay.localeDigest === localeDigest(overlay),
            localeIndexAvailable: localeItem?.status === 'available',
          };
          const report = {
            editionId: generated.id,
            issueNumber: generated.issueNumber,
            canonicalEntries: generated.entries?.length || 0,
            englishEntries: overlay?.entries?.length || 0,
            publicationStatus: result.status,
            localeStatus: result.localeStatus,
            localeReasonCode: result.localeReasonCode || null,
            localeSummary: result.localeSummary || null,
            factsDigest: generatedFacts,
            canonicalCopyDigest: generatedCopy,
            localeDigest: overlay?.localeDigest || null,
            checks,
            allPassed: Object.values(checks).every(Boolean),
            safety: {
              repositoryWritePermission: 'read-only',
              pushedMain: false,
              productionDataMutated: false,
              scheduledTasksTouched: false,
            },
          };
          writeFileSync('artifacts/bilingual-acceptance-report.json', JSON.stringify(report, null, 2) + '\n');
          console.log('=== BILINGUAL ACCEPTANCE REPORT ===');
          console.log(JSON.stringify(report, null, 2));
          if (!report.allPassed) process.exitCode = 1;
          NODE

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bilingual-acceptance-2026-08-29-pm
          path: |
            artifacts/editorial-decisions.json
            artifacts/publication-result.json
            artifacts/bilingual-acceptance-report.json
            public/data/archive/2026/08/2026-08-29-pm.json
            public/data/locales/en/archive/2026/08/2026-08-29-pm.json
          if-no-files-found: warn
          retention-days: 7
