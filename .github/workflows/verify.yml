name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "codex/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, test, and build
        id: check
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee "$RUNNER_TEMP/verify.log"
          status=${PIPESTATUS[0]}
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Surface failure on PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '### Verify failure tail'
            echo '```text'
            tail -n 180 "$RUNNER_TEMP/verify.log"
            echo '```'
          } > "$RUNNER_TEMP/verify-comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$RUNNER_TEMP/verify-comment.md"
