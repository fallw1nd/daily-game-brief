name: Apply localized headline corrections once

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/apply-localized-headlines-2026-08-27.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/localize-story-headlines
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Patch title registry and localization pipeline
        shell: python
        run: |
          import json
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one match in {path}, got {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          registry_path = Path('config/title-translations.json')
          registry = json.loads(registry_path.read_text())
          additions = {
              'minecraft-dungeons': {
                  'titleZhCn': '我的世界：地下城',
                  'titleZhStatus': 'common_translation',
                  'titleEnAliases': ['Minecraft Dungeons'],
                  'evidence': {'kind': 'common_usage', 'note': '编辑部确认的大陆常用译名；官方全球简中页面目前仍保留英文主标题'}
              },
              'minecraft-dungeons-ii': {
                  'titleZhCn': '我的世界：地下城2',
                  'titleZhStatus': 'common_translation',
                  'titleEnAliases': ['Minecraft Dungeons II', 'Minecraft Dungeons 2'],
                  'evidence': {'kind': 'common_usage', 'url': 'https://www.minecraft.net/zh-hans/about-dungeons-ii', 'note': '沿用“我的世界：地下城”常用译名并保留续作序号；官方简中页面确认 II 与 2 为同一作品'}
              },
              'orbitals': {
                  'titleZhCn': '轨道双子星',
                  'titleZhStatus': 'common_translation',
                  'titleEnAliases': ['Orbitals'],
                  'evidence': {'kind': 'common_usage', 'note': '编辑部确认中文名；中文官方社媒与大陆报道稳定使用《轨道双子星》'}
              },
              'stranger-than-heaven': {
                  'titleZhCn': '异于天堂',
                  'titleZhStatus': 'common_translation',
                  'titleEnAliases': ['Stranger Than Heaven'],
                  'evidence': {'kind': 'common_usage', 'note': '编辑部确认中文名；中文官方社媒与大陆报道稳定使用《异于天堂》'}
              },
              'total-war-warhammer-40000': {
                  'titleZhCn': '全面战争：战锤40000',
                  'titleZhStatus': 'official_simplified',
                  'titleEnAliases': ['Total War: Warhammer 40,000', 'Total War: WARHAMMER 40,000', 'Total War: WARHAMMER 40000'],
                  'evidence': {'kind': 'official_source', 'url': 'https://store.steampowered.com/app/4199910/Total_War_WARHAMMER_40000/?l=schinese', 'note': 'Steam 官方简体中文商店名；优先于“全面战争：战锤40K”常用简称'}
              },
              'sonic-pico-park': {
                  'titleZhCn': '索尼克 萌猫公园',
                  'titleZhStatus': 'common_translation',
                  'titleEnAliases': ['Sonic Pico Park', 'SONIC PICO PARK'],
                  'evidence': {'kind': 'common_usage', 'note': '编辑部确认的常用译名；官方当前主标题仍为 SONIC PICO PARK'}
              },
              'alien-isolation-2': {
                  'titleZhCn': '异形：隔离 2',
                  'titleZhStatus': 'official_simplified',
                  'titleEnAliases': ['Alien Isolation 2', 'Alien: Isolation 2'],
                  'evidence': {'kind': 'official_source', 'url': 'https://store.steampowered.com/app/4665290/Alien_Isolation_2/?l=schinese', 'note': 'Steam 官方简体中文商店名'}
              },
              'nodusfall': {
                  'titleZhCn': '源初之结',
                  'titleZhStatus': 'common_translation',
                  'titleEnAliases': ['Nodusfall'],
                  'evidence': {'kind': 'common_usage', 'note': '编辑部确认中文名；大陆官方关联账号与媒体稳定使用《源初之结》'}
              }
          }
          for key, value in additions.items():
              existing = registry['translations'].get(key)
              if existing and existing.get('titleZhCn') != value['titleZhCn']:
                  raise RuntimeError(f'refusing to overwrite different registered translation for {key}: {existing.get("titleZhCn")}')
              if existing:
                  existing.setdefault('titleEnAliases', value.get('titleEnAliases', []))
                  continue
              registry['translations'][key] = value
          registry['updatedAt'] = '2026-08-27'
          registry['translations'] = dict(sorted(registry['translations'].items()))
          registry_path.write_text(json.dumps(registry, ensure_ascii=False, indent=2) + '\n')

          Path('scripts/lib/title-translations.mjs').write_text(r'''import { readFileSync } from "node:fs";
          import { resolve } from "node:path";

          const registryPath = resolve("config/title-translations.json");
          const registry = JSON.parse(readFileSync(registryPath, "utf8"));

          export const titleTranslations = Object.freeze(registry.translations ?? {});

          function normalizedAlias(value) {
            return typeof value === "string" ? value.trim().replace(/\s+/g, " ").toLowerCase() : "";
          }

          export function getRegisteredTitleTranslation(titleKey, titleEn = null) {
            if (typeof titleKey === "string" && titleKey.trim() && titleTranslations[titleKey]) {
              return titleTranslations[titleKey];
            }
            const alias = normalizedAlias(titleEn);
            if (!alias) return null;
            return Object.values(titleTranslations).find((item) =>
              (item.titleEnAliases || []).some((candidate) => normalizedAlias(candidate) === alias)
            ) ?? null;
          }

          export function resolveTitleTranslation({
            titleKey,
            titleZhCn = null,
            titleZhStatus = "unavailable",
            titleEn = null,
          }) {
            const explicitZh = typeof titleZhCn === "string" ? titleZhCn.trim() : "";
            if (titleZhStatus !== "unavailable" && explicitZh) {
              return {
                titleKey,
                titleZhCn: explicitZh,
                titleEn,
                titleZhStatus,
                source: "editorial",
              };
            }

            const registered = getRegisteredTitleTranslation(titleKey, titleEn);
            if (registered?.titleZhCn && registered?.titleZhStatus) {
              return {
                titleKey,
                titleZhCn: registered.titleZhCn,
                titleEn,
                titleZhStatus: registered.titleZhStatus,
                source: "registry",
              };
            }

            return {
              titleKey,
              titleZhCn: null,
              titleEn,
              titleZhStatus: "unavailable",
              source: "original",
            };
          }

          function titlePairs(titleEn, titleZhCn) {
            if (typeof titleEn !== "string" || typeof titleZhCn !== "string") return [];
            const enParts = titleEn.split(/\s*\/\s*/).map((value) => value.trim()).filter(Boolean);
            const zhParts = titleZhCn.split(/\s*\/\s*/).map((value) => value.trim()).filter(Boolean);
            if (enParts.length > 1 && enParts.length === zhParts.length) {
              return enParts.map((english, index) => [english, zhParts[index]]);
            }
            return [[titleEn.trim(), titleZhCn.trim()]];
          }

          export function localizeHeadline(headline, { titleEn = null, titleZhCn = null } = {}) {
            if (typeof headline !== "string" || !headline || !titleZhCn) return headline;
            let localized = headline;
            const pairs = titlePairs(titleEn, titleZhCn).sort((a, b) => b[0].length - a[0].length);
            for (const [english, chinese] of pairs) {
              if (!english || !chinese || english === chinese) continue;
              localized = localized.split(english).join(chinese);
            }
            return localized;
          }
          '''.replace(/^          /gm, ''))

          Path('scripts/backfill-title-translations.mjs').write_text(r'''import fs from "node:fs";
          import path from "node:path";
          import { getRegisteredTitleTranslation, localizeHeadline } from "./lib/title-translations.mjs";

          const archiveRoot = "public/data/archive";
          const latestPath = "public/data/latest.json";
          const manifestPath = "public/data/manifest.json";

          function archiveFiles() {
            const files = [];
            for (const year of fs.readdirSync(archiveRoot)) {
              const yearDir = path.join(archiveRoot, year);
              if (!fs.statSync(yearDir).isDirectory()) continue;
              for (const month of fs.readdirSync(yearDir)) {
                const monthDir = path.join(yearDir, month);
                if (!fs.statSync(monthDir).isDirectory()) continue;
                for (const file of fs.readdirSync(monthDir)) {
                  if (file.endsWith(".json")) files.push(path.join(monthDir, file));
                }
              }
            }
            return files.sort();
          }

          function backfillTitle(title, stats) {
            if (!title || title.title_zh_status !== "unavailable") return false;
            const registered = getRegisteredTitleTranslation(title.title_key, title.title_en);
            if (!registered?.titleZhCn || !registered?.titleZhStatus) return false;
            title.title_zh_cn = registered.titleZhCn;
            title.title_zh_status = registered.titleZhStatus;
            stats.occurrences += 1;
            stats.keys.add(title.title_key);
            return true;
          }

          function localizeEntry(entry, stats) {
            let changed = backfillTitle(entry.title, stats);
            const localizedHeadline = localizeHeadline(entry.headline, {
              titleEn: entry.title?.title_en,
              titleZhCn: entry.title?.title_zh_cn,
            });
            if (localizedHeadline !== entry.headline) {
              entry.headline = localizedHeadline;
              stats.headlines += 1;
              stats.headlineKeys.add(entry.title?.title_key || entry.id);
              changed = true;
            }
            return changed;
          }

          function backfillDocument(file, stats) {
            const document = JSON.parse(fs.readFileSync(file, "utf8"));
            let changed = false;
            for (const item of document.entries || []) changed = localizeEntry(item, stats) || changed;
            for (const item of document.upcoming || []) changed = backfillTitle(item.title, stats) || changed;
            const lead = (document.entries || []).find((item) => item.id === document.leadEntryId);
            if (lead && document.archiveTitle) {
              const localizedArchiveTitle = localizeHeadline(document.archiveTitle, {
                titleEn: lead.title?.title_en,
                titleZhCn: lead.title?.title_zh_cn,
              });
              if (localizedArchiveTitle !== document.archiveTitle) {
                document.archiveTitle = localizedArchiveTitle;
                stats.archiveTitles += 1;
                changed = true;
              }
            }
            if (changed) {
              fs.writeFileSync(file, `${JSON.stringify(document, null, 2)}\n`);
              stats.files += 1;
            }
            return document;
          }

          const makeStats = () => ({ files: 0, occurrences: 0, keys: new Set(), headlines: 0, headlineKeys: new Set(), archiveTitles: 0 });
          const archiveStats = makeStats();
          const archiveDocs = new Map();
          for (const file of archiveFiles()) {
            const document = backfillDocument(file, archiveStats);
            archiveDocs.set(document.id, document);
          }

          const latestStats = makeStats();
          if (fs.existsSync(latestPath)) backfillDocument(latestPath, latestStats);

          let manifestChanged = false;
          if (fs.existsSync(manifestPath)) {
            const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
            for (const item of manifest.editions || []) {
              const archive = archiveDocs.get(item.id);
              if (archive?.archiveTitle && item.archiveTitle !== archive.archiveTitle) {
                item.archiveTitle = archive.archiveTitle;
                manifestChanged = true;
              }
            }
            if (manifestChanged) fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
          }

          console.log(`Title backfill: ${archiveStats.keys.size} unique key(s), ${archiveStats.occurrences} archive title occurrence(s), ${archiveStats.headlines} headline(s), ${archiveStats.archiveTitles} archive title(s), ${archiveStats.files} archive file(s) changed.`);
          console.log(`Latest: ${latestStats.occurrences} title occurrence(s), ${latestStats.headlines} headline(s), ${latestStats.archiveTitles} archive title(s), changed=${latestStats.files > 0}.`);
          console.log(`Manifest archive titles changed=${manifestChanged}.`);
          '''.replace(/^          /gm, ''))

          replace_once(
              'scripts/lib/edition-publisher.mjs',
              'import { resolveTitleTranslation } from "./title-translations.mjs";',
              'import { localizeHeadline, resolveTitleTranslation } from "./title-translations.mjs";'
          )
          replace_once(
              'scripts/lib/edition-publisher.mjs',
              '''    entryByEvent.set(decision.eventKey, id);\n    return {\n      id,\n      section: decision.section,\n      title: displayTitle(decision),\n      headline: decision.headline,''',
              '''    entryByEvent.set(decision.eventKey, id);\n    const title = displayTitle(decision);\n    return {\n      id,\n      section: decision.section,\n      title,\n      headline: localizeHeadline(decision.headline, { titleEn: title.title_en, titleZhCn: title.title_zh_cn }),'''
          )
          replace_once(
              'scripts/lib/edition-publisher.mjs',
              '''  const generatedAt = beijingNow(now);''',
              '''  const leadEntryId = entryByEvent.get(editorial.leadEventKey) || entries[0].id;\n  const leadEntry = entries.find((item) => item.id === leadEntryId) || entries[0];\n  const archiveTitle = localizeHeadline(editorial.archiveTitle, {\n    titleEn: leadEntry.title?.title_en,\n    titleZhCn: leadEntry.title?.title_zh_cn,\n  });\n  const generatedAt = beijingNow(now);'''
          )
          replace_once(
              'scripts/lib/edition-publisher.mjs',
              '''    archiveTitle: editorial.archiveTitle,\n    leadEntryId: entryByEvent.get(editorial.leadEventKey) || entries[0].id,''',
              '''    archiveTitle,\n    leadEntryId,'''
          )

          replace_once(
              'scripts/editorialize.mjs',
              '  "译名查询是证据包完整性规则的唯一窄范围例外：只可用于确认作品名称，不得借此加入新事件、新事实、时间、平台或其他正文信息。",',
              '  "译名查询是证据包完整性规则的唯一窄范围例外：只可用于确认作品名称，不得借此加入新事件、新事实、时间、平台或其他正文信息。",\n  "只要 titleZhCn 已确认，headline 中作为作品主体出现的同一英文名必须使用该中文名；英文原名只保留在 titleEn 元数据中。",'
          )

          replace_once(
              'docs/SCHEDULED_TASK_PROMPT.md',
              '   - Never machine-translate, literally translate, or invent a Chinese game name merely to fill the field.\n5. Title-name lookup',
              '   - Never machine-translate, literally translate, or invent a Chinese game name merely to fill the field.\n   - Once `titleZhCn` is resolved, use that same Chinese name wherever the game subject appears in `headline` and the lead `archiveTitle`; keep the English original in `titleEn` metadata rather than repeating it as the visible story subject.\n5. Title-name lookup'
          )

          replace_once(
              'docs/DATA_PIPELINE.md',
              'Historical title-field corrections use `npm run titles:backfill`; the command only fills currently unavailable title fields and does not overwrite an existing official/common translation.',
              'Historical title-field corrections use `npm run titles:backfill`; the command fills currently unavailable title fields without overwriting an existing official/common translation, then normalizes visible story headlines and lead archive titles so a resolved Chinese game name does not remain English in display copy. The original English name stays in `title_en` metadata.'
          )

          test_path = Path('scripts/title-translations.test.mjs')
          test_text = test_path.read_text()
          test_text = test_text.replace(
              'import { resolveTitleTranslation } from "./lib/title-translations.mjs";',
              'import { localizeHeadline, resolveTitleTranslation } from "./lib/title-translations.mjs";'
          )
          marker = '\n});\n'
          extra = r'''

            it("resolves a registered alias even when the generated title key differs", () => {
              expect(resolveTitleTranslation({
                titleKey: "generated-key-that-differs",
                titleZhCn: null,
                titleZhStatus: "unavailable",
                titleEn: "Alien Isolation 2",
              })).toMatchObject({
                titleZhCn: "异形：隔离 2",
                titleZhStatus: "official_simplified",
                source: "registry",
              });
            });

            it("localizes exact English game subjects in headlines", () => {
              expect(localizeHeadline("《Fallout 76》首次开放测试", {
                titleEn: "Fallout 76",
                titleZhCn: "辐射76",
              })).toBe("《辐射76》首次开放测试");
            });

            it("localizes combined game subjects independently", () => {
              expect(localizeHeadline("Capcom公开《Mega Man: Dual Override》与《Dragon’s Dogma 2: Dark Arisen》试玩", {
                titleEn: "Mega Man: Dual Override / Dragon’s Dogma 2: Dark Arisen",
                titleZhCn: "洛克人：双重超控 / 龙之信条2：黑暗觉者",
              })).toBe("Capcom公开《洛克人：双重超控》与《龙之信条2：黑暗觉者》试玩");
            });
          '''.replace('          ', '')
          if 'resolves a registered alias even when the generated title key differs' not in test_text:
              test_text = test_text.rsplit(marker, 1)[0] + extra + marker
          test_path.write_text(test_text)

          publisher_test = Path('scripts/edition-publisher.test.mjs')
          publisher_text = publisher_test.read_text()
          publisher_text = publisher_text.replace(
              '''        titleZhStatus: "unavailable",\n      }],\n    };''',
              '''        titleZhStatus: "unavailable",\n        headline: "《Fable》正式公布",\n      }],\n      archiveTitle: "早报｜《Fable》正式公布",\n    };''',
              1
          )
          publisher_text = publisher_text.replace(
              '''      title_zh_status: "official_simplified",\n    });\n  });''',
              '''      title_zh_status: "official_simplified",\n    });\n    expect(result.edition.entries[0].headline).toBe("《神鬼寓言》正式公布");\n    expect(result.edition.archiveTitle).toBe("早报｜《神鬼寓言》正式公布");\n  });''',
              1
          )
          publisher_test.write_text(publisher_text)

      - name: Backfill registered titles and visible headlines
        run: npm run titles:backfill

      - name: Audit no stale English subjects remain
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const pairsFor = (t) => {
            if (!t?.title_en || !t?.title_zh_cn) return [];
            const ens = t.title_en.split(/\s*\/\s*/).map(v => v.trim()).filter(Boolean);
            const zhs = t.title_zh_cn.split(/\s*\/\s*/).map(v => v.trim()).filter(Boolean);
            return ens.length === zhs.length && ens.length > 1 ? ens.map((en, i) => [en, zhs[i]]) : [[t.title_en, t.title_zh_cn]];
          };
          const stale = [];
          for (const year of fs.readdirSync('public/data/archive')) {
            const yd = path.join('public/data/archive', year);
            if (!fs.statSync(yd).isDirectory()) continue;
            for (const month of fs.readdirSync(yd)) {
              const md = path.join(yd, month);
              if (!fs.statSync(md).isDirectory()) continue;
              for (const file of fs.readdirSync(md)) {
                if (!file.endsWith('.json')) continue;
                const full = path.join(md, file);
                const doc = JSON.parse(fs.readFileSync(full, 'utf8'));
                for (const entry of doc.entries || []) {
                  for (const [en, zh] of pairsFor(entry.title)) {
                    if (en !== zh && entry.headline?.includes(en)) stale.push(`${full}:${entry.id}:${en}`);
                  }
                }
              }
            }
          }
          console.log(`Stale localized headline subjects: ${stale.length}`);
          if (stale.length) { console.log(stale.join('\n')); process.exit(1); }

      - name: Validate repository
        run: npm run check

      - name: Guard changed paths
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(config/title-translations\.json|docs/DATA_PIPELINE\.md|docs/SCHEDULED_TASK_PROMPT\.md|scripts/backfill-title-translations\.mjs|scripts/editorialize\.mjs|scripts/edition-publisher\.test\.mjs|scripts/lib/edition-publisher\.mjs|scripts/lib/title-translations\.mjs|scripts/title-translations\.test\.mjs|public/data/latest\.json|public/data/manifest\.json|public/data/archive/.+\.json)$' | grep -q .; then
            echo 'Unexpected changed path:'
            echo "$changed"
            exit 1
          fi
          test -n "$changed"

      - name: Commit corrections
        shell: bash
        run: |
          git config user.name 'daily-game-brief[bot]'
          git config user.email 'daily-game-brief[bot]@users.noreply.github.com'
          git add config/title-translations.json docs/DATA_PIPELINE.md docs/SCHEDULED_TASK_PROMPT.md scripts public/data
          git commit -m 'fix(titles): localize visible story headlines'
          git push origin HEAD:codex/localize-story-headlines
