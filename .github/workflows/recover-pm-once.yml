name: Recover PM once

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/recover-pm-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch existing PM SLA recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run brief-sla-watchdog.yml --repo "$GITHUB_REPOSITORY" --ref main -f period=pm
