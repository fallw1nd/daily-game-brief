name: Apply current title translations

on:
  push:
    branches:
      - codex/current-edition-title-translations
    paths:
      - scripts/apply-current-title-translations.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/current-edition-title-translations
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply registry and localization changes
        run: |
          node scripts/apply-current-title-translations.mjs
          npm run titles:backfill
          npm run check
      - name: Commit generated changes
        shell: bash
        run: |
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add config/title-translations.json scripts/lib/title-translations.mjs scripts/backfill-title-translations.mjs scripts/lib/edition-publisher.mjs scripts/title-translations.test.mjs public/data
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix(titles): localize current edition names in body copy"
          git push origin HEAD:codex/current-edition-title-translations
