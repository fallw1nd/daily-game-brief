name: Audit title translations once

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/audit-title-translations-2026-08-27.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Scan title translations
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const root = 'public/data/archive';
          const files = [];
          for (const year of fs.readdirSync(root)) {
            const yearDir = path.join(root, year);
            if (!fs.statSync(yearDir).isDirectory()) continue;
            for (const month of fs.readdirSync(yearDir)) {
              const monthDir = path.join(yearDir, month);
              if (!fs.statSync(monthDir).isDirectory()) continue;
              for (const file of fs.readdirSync(monthDir)) {
                if (file.endsWith('.json')) files.push(path.join(monthDir, file));
              }
            }
          }
          const known = new Map();
          const unavailable = new Map();
          for (const file of files.sort()) {
            const edition = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const [kind, items] of [['entry', edition.entries || []], ['upcoming', edition.upcoming || []]]) {
              for (const item of items) {
                const title = item.title || {};
                const key = title.title_key || title.title_en || '(missing-key)';
                if (title.title_zh_cn && title.title_zh_status !== 'unavailable') {
                  const signature = `${key}\u0000${title.title_zh_cn}\u0000${title.title_zh_status}`;
                  const current = known.get(signature) || {
                    titleKey: key,
                    titleEn: title.title_en || null,
                    titleZhCn: title.title_zh_cn,
                    titleZhStatus: title.title_zh_status,
                    editions: new Set(),
                    kinds: new Set(),
                  };
                  current.editions.add(edition.id);
                  current.kinds.add(kind);
                  known.set(signature, current);
                }
                if (title.title_zh_status === 'unavailable') {
                  const current = unavailable.get(key) || {
                    titleKey: key,
                    titleEn: title.title_en || null,
                    editions: new Set(),
                    kinds: new Set(),
                    headlines: new Set(),
                  };
                  current.editions.add(edition.id);
                  current.kinds.add(kind);
                  if (item.headline) current.headlines.add(item.headline);
                  unavailable.set(key, current);
                }
              }
            }
          }
          const serialize = (item) => ({
            ...item,
            editions: [...item.editions],
            kinds: [...item.kinds],
            ...(item.headlines ? { headlines: [...item.headlines] } : {}),
          });
          const report = {
            generatedAt: new Date().toISOString(),
            editionCount: files.length,
            knownTranslations: [...known.values()].map(serialize).sort((a, b) => a.titleKey.localeCompare(b.titleKey)),
            unavailableTitles: [...unavailable.values()].map(serialize).sort((a, b) => a.titleKey.localeCompare(b.titleKey)),
          };
          fs.mkdirSync('artifacts', { recursive: true });
          fs.writeFileSync('artifacts/title-translations-audit.json', JSON.stringify(report, null, 2) + '\n');
          console.log(`Known translations: ${report.knownTranslations.length}; unavailable unique titles: ${report.unavailableTitles.length}.`);

      - name: Upload audit
        uses: actions/upload-artifact@v6
        with:
          name: title-translations-audit
          path: artifacts/title-translations-audit.json
          retention-days: 7
