name: Fix DeepSeek patch runner once

on:
  push:
    branches:
      - codex/deepseek-media-search
    paths:
      - .github/workflows/fix-deepseek-patch-runner-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/deepseek-media-search
      - name: Make replacements literal
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/patch-deepseek-media-search-once-v2.yml')
          text = path.read_text()
          pairs = [
              ('meta_pattern.subn(meta_replacement, text, count=1)', 'meta_pattern.subn(lambda _: meta_replacement, text, count=1)'),
              ('discovery_pattern.subn(discovery_replacement, text, count=1)', 'discovery_pattern.subn(lambda _: discovery_replacement, text, count=1)'),
          ]
          for old, new in pairs:
            if old not in text:
              raise SystemExit(f'patch runner anchor missing: {old}')
            text = text.replace(old, new, 1)
          path.write_text(text)
      - name: Commit fix
        run: |
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add .github/workflows/patch-deepseek-media-search-once-v2.yml
          git commit -m "chore: fix DeepSeek patch runner escaping"
          git push origin HEAD:codex/deepseek-media-search
