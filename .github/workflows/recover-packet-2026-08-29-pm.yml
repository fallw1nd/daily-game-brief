name: Recover packet 2026-08-29-pm

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/recover-packet-2026-08-29-pm.yml

permissions:
  actions: write
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch exact packet recovery
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run news-discovery-shadow.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f period=pm \
            -f edition=2026-08-29-pm
