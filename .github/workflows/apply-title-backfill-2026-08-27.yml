name: Apply title translation backfill once

on:
  push:
    branches:
      - automation/state
    paths:
      - .github/workflows/apply-title-backfill-2026-08-27.yml

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: codex/title-translation-fallback
          fetch-depth: 0

      - name: Strengthen title-state validation
        shell: python
        run: |
          from pathlib import Path
          p = Path('scripts/validate-data.mjs')
          text = p.read_text()
          old = '''  if (title.title_zh_status === "unavailable" && title.title_zh_cn) {
            errors.push(`${context}: unavailable Chinese title must not include title_zh_cn`);
          }
          '''
          new = '''  if (title.title_zh_status === "unavailable" && title.title_zh_cn) {
            errors.push(`${context}: unavailable Chinese title must not include title_zh_cn`);
          }
          if (title.title_zh_status !== "unavailable" &&
              (typeof title.title_zh_cn !== "string" || title.title_zh_cn.trim().length === 0)) {
            errors.push(`${context}: ${title.title_zh_status} requires title_zh_cn`);
          }
          '''
          if old not in text:
              raise SystemExit('validator target block not found')
          p.write_text(text.replace(old, new, 1))

      - name: Install dependencies
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Backfill registered translations
        run: npm run titles:backfill

      - name: Audit remaining unavailable titles
        shell: node {0}
        run: |
          const fs = require('fs');
          const path = require('path');
          const keys = new Set();
          let occurrences = 0;
          for (const year of fs.readdirSync('public/data/archive')) {
            const yearDir = path.join('public/data/archive', year);
            if (!fs.statSync(yearDir).isDirectory()) continue;
            for (const month of fs.readdirSync(yearDir)) {
              const monthDir = path.join(yearDir, month);
              if (!fs.statSync(monthDir).isDirectory()) continue;
              for (const file of fs.readdirSync(monthDir)) {
                if (!file.endsWith('.json')) continue;
                const edition = JSON.parse(fs.readFileSync(path.join(monthDir, file), 'utf8'));
                for (const item of [...(edition.entries || []), ...(edition.upcoming || [])]) {
                  if (item.title?.title_zh_status === 'unavailable') {
                    keys.add(item.title.title_key || item.title.title_en);
                    occurrences += 1;
                  }
                }
              }
            }
          }
          console.log(`Remaining unavailable: ${keys.size} unique title(s), ${occurrences} occurrence(s).`);

      - name: Validate repository
        run: npm run check

      - name: Guard changed paths
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          if echo "$changed" | grep -Ev '^(scripts/validate-data\.mjs|public/data/latest\.json|public/data/archive/.+\.json)$' | grep -q .; then
            echo 'Unexpected changed path after backfill:'
            echo "$changed"
            exit 1
          fi
          test -n "$changed"

      - name: Commit backfill
        shell: bash
        run: |
          git config user.name 'daily-game-brief[bot]'
          git config user.email 'daily-game-brief[bot]@users.noreply.github.com'
          git add scripts/validate-data.mjs public/data/latest.json public/data/archive
          git commit -m 'chore(titles): backfill confirmed Chinese names'
          git push origin HEAD:codex/title-translation-fallback
