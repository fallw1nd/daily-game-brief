name: One-off reliability cleanup

on:
  push:
    branches: [fix/reliability-buffer-cleanup]
    paths: [.github/workflows/oneoff-reliability-cleanup.yml]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/reliability-buffer-cleanup
          fetch-depth: 0
      - name: Update docs, tests, and maintenance ledger
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f"missing expected text in {path}: {old[:80]!r}")
              p.write_text(s.replace(old, new))

          replace(
              "docs/SCHEDULED_TASK_PROMPT.md",
              "`Final editorial packet` remains scheduled at the fixed 10:10/17:00 cutoffs, while the SLA watchdog remains 10:45/17:35.",
              "`Final editorial packet` remains scheduled at the fixed 10:10/17:00 cutoffs, while the SLA watchdog runs at 11:00/17:50. Scheduled media recovery runs later at 11:10/18:00; normal publisher-triggered media enrichment remains immediate."
          )
          p = Path("docs/SCHEDULED_TASK_PROMPT.md")
          s = p.read_text()
          marker = "## Input\n\n"
          addition = (
              "## Target edition resolution\n\n"
              "Never derive the edition date from the task's actual execution calendar date alone. Resolve the target as the most recent already-due fixed window for this task's period in `Asia/Shanghai`: for AM, use today's `YYYY-MM-DD-am` only when Beijing time is at or after 10:10, otherwise use the previous day's AM; for PM, use today's `YYYY-MM-DD-pm` only when Beijing time is at or after 17:00, otherwise use the previous day's PM. This rule exists so a delayed task that starts after midnight still targets the window that actually reached cutoff. The target's `plannedAt`, `windowStart`, `windowEnd`, and `coverageThrough` remain fixed and never follow the delayed runtime. If a normal Canonical edition for that exact target already exists, verify it and stop rather than advancing to a future not-yet-due edition.\n\n"
          )
          if addition not in s:
              if marker not in s:
                  raise SystemExit("scheduled contract input marker missing")
              p.write_text(s.replace(marker, addition + marker, 1))

          replace("docs/AUTOMATION_ARCHITECTURE.md", "The 10:45/17:35 SLA watchdog first restores the matching packet", "The 11:00/17:50 SLA watchdog first restores the matching packet")
          arch = Path("docs/AUTOMATION_ARCHITECTURE.md")
          s = arch.read_text()
          needle = "Normally the finalized packet should already exist when ChatGPT begins."
          insert = "A delayed ChatGPT invocation resolves its target from the most recent already-due fixed cutoff for that period, never from the delayed execution date alone. This prevents a post-midnight PM run from jumping to the next day's not-yet-due PM edition.\n\n"
          if insert not in s:
              if needle not in s:
                  raise SystemExit("architecture handoff marker missing")
              arch.write_text(s.replace(needle, insert + needle, 1))

          test = Path("scripts/scheduled-task-contract.test.mjs")
          s = test.read_text()
          s = s.replace('expect(contract).toContain("SLA watchdog remains 10:45/17:35");', 'expect(contract).toContain("SLA watchdog runs at 11:00/17:50");')
          if 'const slaWorkflow' not in s:
              decl = 'const packetWorkflow = await readFile(".github/workflows/news-discovery-shadow.yml", "utf8");\n'
              s = s.replace(decl, decl + 'const slaWorkflow = await readFile(".github/workflows/brief-sla-watchdog.yml", "utf8");\nconst mediaWorkflow = await readFile(".github/workflows/media-enrichment.yml", "utf8");\n', 1)
          anchor = '    expect(contract).toContain("the ten-minute buffer must never widen either evidence window or admit post-cutoff information");\n'
          extra = '    expect(contract).toContain("Never derive the edition date from the task\\'s actual execution calendar date alone");\n    expect(contract).toContain("most recent already-due fixed window for this task\\'s period");\n    expect(contract).toContain("otherwise use the previous day\\'s PM");\n'
          if "Never derive the edition date" not in s:
              s = s.replace(anchor, anchor + extra, 1)
          cron_anchor = '    expect(packetWorkflow).toContain(\'- cron: "0 9 * * *"\');\n'
          cron_extra = '    expect(slaWorkflow).toContain(\'- cron: "0 3 * * *"\');\n    expect(slaWorkflow).toContain(\'- cron: "50 9 * * *"\');\n    expect(mediaWorkflow).toContain(\'- cron: "10 3 * * *"\');\n    expect(mediaWorkflow).toContain(\'- cron: "0 10 * * *"\');\n'
          if "slaWorkflow).toContain" not in s:
              s = s.replace(cron_anchor, cron_anchor + cron_extra, 1)
          test.write_text(s)

          log = Path("docs/MAINTENANCE_LOG.md")
          s = log.read_text()
          if "MNT-20260830-01" not in s:
              s += '''\n## MNT-20260830-01 — Scheduled Task 延迟跨日时按执行日可能错期\n\n- **Discovered:** 2026-08-30\n- **Priority:** P0\n- **Area:** Scheduled task / edition resolution\n- **Status:** in_progress\n- **Evidence:** 长期任务原 prompt 将目标 edition 直接绑定为“任务执行日”的 AM/PM；若 PM 因平台延迟到次日 00:xx 才启动，会错误跳到次日尚未到 cutoff 的 PM。\n- **Risk:** 跨日延迟可再次造成 wrong-edition packet lookup/recovery。\n- **Proposed resolution:** 目标 edition 按 `Asia/Shanghai` 同 period 最近一个已经到 cutoff 的固定窗口解析；Scheduled prompt 只保留启动/恢复骨架，详细编辑规则以仓库实时契约为唯一来源。\n- **Close when:** 契约测试与两个实际 Scheduled Task prompt 已同步；至少一轮真实生产确认目标 edition 正确。\n- **Resolution:** implementation prepared in reliability cleanup PR.\n- **Verification:** waiting for PR Verify and next real production run.\n\n## MNT-20260830-02 — Buffered handoff 后 SLA 与 media recovery 仍过早\n\n- **Discovered:** 2026-08-30\n- **Priority:** P1\n- **Area:** scheduling / SLA / media recovery\n- **Status:** in_progress\n- **Evidence:** ChatGPT 已调整为 10:20/17:10，但 SLA 仍为 10:45/17:35；Scheduled Task 曾出现十余分钟延迟。media scheduled recovery 仍在 10:35/17:25，可能在正文尚未发布时空跑。\n- **Risk:** 正常稿与 degraded fallback 竞跑；media recovery 增加无效 Actions 成本。\n- **Proposed resolution:** SLA 放宽为 11:00/17:50；scheduled media recovery 后移到 11:10/18:00；publisher 的 exact-edition 即时 media dispatch 不变。\n- **Close when:** workflow cron、文档和测试一致；Verify/Pages 成功；至少一轮真实 AM/PM 未被过早 fallback 抢跑。\n- **Resolution:** implementation prepared in reliability cleanup PR.\n- **Verification:** waiting for PR Verify and next real production run.\n'''
              log.write_text(s)
          PY
          git config user.name "daily-game-brief[bot]"
          git config user.email "daily-game-brief[bot]@users.noreply.github.com"
          git add docs scripts/scheduled-task-contract.test.mjs
          git commit -m "docs(automation): harden delayed handoff contract"
          git push origin HEAD:fix/reliability-buffer-cleanup
