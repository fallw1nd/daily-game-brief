<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="游戏圈动态：每天北京时间10:10与17:00更新的可核验游戏行业热点简报。"
    />
    <meta name="theme-color" content="#FDFBF7" />
    <link rel="stylesheet" href="/src/reading.css" />
    <link rel="stylesheet" href="/src/components/edition-loading.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E65C00'/%3E%3Cpath d='M18 17h28v8H28v6h14v8H28v8H18z' fill='%23FDFBF7'/%3E%3C/svg%3E"
    />
    <title>游戏圈动态｜每日游戏热点简报</title>
  </head>
  <body>
    <div id="root"><div class="reading-app r-loading-page r-bootstrap" data-theme="light" data-accent="orange">
      <main><div class="r-edition-loading" role="status" aria-live="polite" aria-atomic="true">
        <div class="r-loader-mark" aria-hidden="true">
          <span class="r-loader-sheet r-loader-sheet--back"></span>
          <span class="r-loader-sheet r-loader-sheet--middle"></span>
          <span class="r-loader-sheet r-loader-sheet--front"><i></i><i></i><i></i></span>
        </div>
        <div class="r-loader-copy">
          <span class="r-loader-eyebrow">DAILY GAME BRIEF</span>
          <h1 lang="zh-CN">正在读取简报</h1><h1 lang="en">Loading your brief</h1>
          <p lang="zh-CN">新闻，即将呈现。</p><p lang="en">News, ready to read.</p>
        </div>
        <div class="r-loader-track" aria-hidden="true"><span></span></div>
      </div></main>
    </div></div>
    <script>
      (() => {
        const boot = document.querySelector('.r-bootstrap');
        document.documentElement.lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'zh-CN';
        let theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        try {
          const saved = localStorage.getItem('brief-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
          boot.dataset.accent = localStorage.getItem('brief-accent') || 'orange';
        } catch { /* Storage is optional. */ }
        boot.dataset.theme = theme;
      })();
    </script>
    <noscript><style>.r-bootstrap { display: none; }</style><p class="r-loading-noscript">请启用 JavaScript 以阅读简报。 / Enable JavaScript to read the brief.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
